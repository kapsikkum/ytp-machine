<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YTP Machine</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Impact&family=VT323&family=Roboto+Mono:wght@400;700&display=swap');

    :root {
      --yellow: #ffe500;
      --green:  #00ff88;
      --red:    #ff3c3c;
      --dark:   #0d0d0d;
      --panel:  #141414;
      --border: #2a2a2a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark);
      color: #e8e8e8;
      font-family: 'Roboto Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    header h1 {
      font-family: Impact, 'Arial Black', sans-serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--yellow);
      text-shadow:
        3px  3px 0 #b3a000,
       -2px -2px 0 #000,
        2px -2px 0 #000,
       -2px  2px 0 #000;
      line-height: 1;
    }
    header p {
      color: #888;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      letter-spacing: 1px;
    }

    /* ── Stats bar ── */
    #stats-bar {
      display: flex;
      gap: 1.5rem;
      font-size: 0.75rem;
      color: #555;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    #stats-bar span { color: var(--yellow); }

    /* ── Main card ── */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.75rem;
      width: 100%;
      max-width: 700px;
    }

    /* ── Input area ── */
    #form { display: flex; flex-direction: column; gap: 1rem; }

    #text-input {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e8e8e8;
      font-family: 'Roboto Mono', monospace;
      font-size: 1.1rem;
      line-height: 1.6;
      padding: 0.85rem 1rem;
      resize: vertical;
      min-height: 90px;
      transition: border-color 0.15s;
    }
    #text-input:focus {
      outline: none;
      border-color: var(--yellow);
    }
    #text-input::placeholder { color: #444; }

    #submit-btn {
      align-self: flex-end;
      background: var(--yellow);
      border: none;
      border-radius: 6px;
      color: #000;
      cursor: pointer;
      font-family: Impact, sans-serif;
      font-size: 1.2rem;
      letter-spacing: 1.5px;
      padding: 0.65rem 2rem;
      text-transform: uppercase;
      transition: transform 0.1s, background 0.15s;
    }
    #submit-btn:hover { background: #ffd000; }
    #submit-btn:active { transform: scale(0.97); }
    #submit-btn:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Autocomplete ── */
    #input-wrap { position: relative; width: 100%; }
    #input-wrap #text-input { display: block; width: 100%; }

    #suggest-box {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 10;
      background: #1a1a1a;
      border: 1px solid #333;
      border-top: none;
      border-radius: 0 0 6px 6px;
      max-height: 240px;
      overflow-y: auto;
      display: none;
    }
    #suggest-box.open { display: block; }

    .suggest-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.4rem 1rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .suggest-item:hover, .suggest-item.active { background: #262626; }
    .suggest-item .s-word { color: #e8e8e8; }
    .suggest-item .s-meta {
      font-size: 0.7rem;
      border-radius: 3px;
      padding: 0.1rem 0.45rem;
      white-space: nowrap;
    }
    .suggest-item.phrase .s-meta { background: #06263a; color: #7dd3fc; border: 1px solid #0e4a6e; }
    .suggest-item.vocab  .s-meta { background: #003d1f; color: var(--green); border: 1px solid #005a2c; }

    /* ── Live word check ── */
    #word-check {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: #555;
      min-height: 1.1em;
      letter-spacing: 0.3px;
    }
    #word-check .unknown { color: #ffaa00; }

    /* ── Status ── */
    #status {
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: #888;
      min-height: 1.2em;
      letter-spacing: 0.5px;
    }
    #status.error { color: var(--red); }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #444;
      border-top-color: var(--yellow);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Word tags ── */
    #word-results {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .word-tag {
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      text-transform: lowercase;
      letter-spacing: 0.5px;
    }
    .word-tag.found   { background: #003d1f; color: var(--green);  border: 1px solid #005a2c; }
    .word-tag.run     { background: #06263a; color: #7dd3fc;       border: 1px solid #0e4a6e; }
    .word-tag.spliced { background: #3d2800; color: #ffaa00;       border: 1px solid #5a3d00; }
    .word-tag.missing { background: #3d0000; color: var(--red);    border: 1px solid #5a0000; }

    .word-tag .rate-down {
      margin-left: 0.4rem;
      padding: 0;
      border: none;
      background: none;
      color: inherit;
      font-size: 0.75rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.12s;
    }
    .word-tag .rate-down:hover { opacity: 1; }
    .word-tag.rated { opacity: 0.45; }
    .word-tag.rated .rate-down { opacity: 1; cursor: default; }

    /* ── Legend ── */
    #legend {
      margin-top: 0.75rem;
      font-size: 0.7rem;
      color: #555;
      display: flex;
      gap: 1rem;
    }
    #legend .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
    #legend .dot.found   { background: var(--green); }
    #legend .dot.run     { background: #7dd3fc; }
    #legend .dot.spliced { background: #ffaa00; }
    #legend .dot.missing { background: var(--red); }

    /* ── Video player ── */
    #video-container {
      margin-top: 2rem;
      display: none;
    }
    #video-container.visible { display: block; }

    #video-container h2 {
      font-family: Impact, sans-serif;
      font-size: 1.1rem;
      color: var(--yellow);
      letter-spacing: 1px;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
    }

    #output-video {
      width: 100%;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #000;
      display: block;
    }

    #download-link {
      display: inline-block;
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--yellow);
      text-decoration: none;
      border: 1px solid var(--yellow);
      border-radius: 4px;
      padding: 0.3rem 0.8rem;
      transition: background 0.15s;
    }
    #download-link:hover { background: rgba(255,229,0,0.1); }

    /* ── Footer ── */
    footer {
      margin-top: 3rem;
      color: #333;
      font-size: 0.7rem;
      text-align: center;
      line-height: 1.8;
    }
    footer a { color: #555; }
  </style>
</head>
<body>

<header>
  <h1>YTP Machine</h1>
</header>

<div id="stats-bar">
  <div>clips in database: <span id="stat-clips">—</span></div>
  <div>unique words: <span id="stat-words">—</span></div>
  <div>video sources: <span id="stat-sources">—</span></div>
</div>

<div class="card">
  <form id="form" autocomplete="off">
    <div id="input-wrap">
      <textarea
        id="text-input"
        name="text"
        rows="3"
        placeholder="nice rice … or perhaps some chocolate cake"
        spellcheck="false"
        autocomplete="off"
      ></textarea>
      <div id="suggest-box"></div>
    </div>
    <div id="word-check"></div>
    <button type="submit" id="submit-btn">GENERATE</button>
  </form>

  <div id="status"></div>
  <div id="word-results"></div>
  <div id="legend" style="display:none">
    <span><span class="dot run"></span> real phrase</span>
    <span><span class="dot found"></span> direct match</span>
    <span><span class="dot spliced"></span> phoneme splice</span>
    <span><span class="dot missing"></span> missing</span>
  </div>

  <div id="video-container">
    <h2>Result</h2>
    <video id="output-video" controls playsinline></video>
    <br>
    <a id="download-link" download>Download .mp4</a>
  </div>
</div>


<script>
  const form       = document.getElementById('form');
  const textInput  = document.getElementById('text-input');
  const submitBtn  = document.getElementById('submit-btn');
  const statusEl   = document.getElementById('status');
  const wordRes    = document.getElementById('word-results');
  const legendEl   = document.getElementById('legend');
  const videoBox   = document.getElementById('video-container');
  const videoEl    = document.getElementById('output-video');
  const dlLink     = document.getElementById('download-link');

  // ── Load stats ──────────────────────────────────────────────────────────────
  async function loadStats() {
    try {
      const r = await fetch('/api/stats');
      if (!r.ok) return;
      const d = await r.json();
      document.getElementById('stat-clips').textContent   = d.total_clips.toLocaleString();
      document.getElementById('stat-words').textContent   = d.unique_words.toLocaleString();
      document.getElementById('stat-sources').textContent = d.sources.toLocaleString();
    } catch { /* ignore */ }
  }
  loadStats();

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function setStatus(msg, isError = false) {
    statusEl.className = isError ? 'error' : '';
    statusEl.innerHTML = msg;
  }

  // Render the exact spoken words in order, coloured by status.  Uses the
  // backend's token list so expanded numbers ("42" → forty two) and every
  // splice/miss are shown accurately rather than guessed from the input.
  const TITLES = {
    run:     'spoken as one continuous clip',
    found:   'direct match',
    spliced: 'built from phoneme segments',
    missing: 'not in the corpus',
  };
  function renderWords(tokens) {
    wordRes.innerHTML = '';
    if (!tokens || !tokens.length) return;
    tokens.forEach(t => {
      const cls = ['run', 'found', 'spliced', 'missing'].includes(t.status) ? t.status : 'missing';
      const tag = document.createElement('span');
      tag.className = 'word-tag ' + cls;
      tag.title = TITLES[cls];

      const label = document.createElement('span');
      label.textContent = t.word;
      tag.appendChild(label);

      // Phoneme splices can sound rough — let the user down-rate one so the
      // clips that built it are avoided next time.
      if (cls === 'spliced' && Array.isArray(t.clips) && t.clips.length) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'rate-down';
        btn.textContent = '👎';
        btn.title = 'This splice sounds bad — avoid these clips next time';
        btn.addEventListener('click', () => rateSplice(t.word, t.clips, tag, btn));
        tag.appendChild(btn);
      }
      wordRes.appendChild(tag);
    });
    legendEl.style.display = 'flex';
  }

  async function rateSplice(word, clips, tag, btn) {
    if (tag.classList.contains('rated')) return;
    btn.disabled = true;
    try {
      const r = await fetch('/api/rate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ word, clips, rating: -1 }),
      });
      if (r.ok) {
        tag.classList.add('rated');
        btn.textContent = '✓';
        btn.title = 'Noted — regenerate to hear a different splice';
      } else {
        btn.disabled = false;
      }
    } catch {
      btn.disabled = false;
    }
  }

  // ── Submit ───────────────────────────────────────────────────────────────────
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = textInput.value.trim();
    if (!text) return;

    // Reset UI
    submitBtn.disabled = true;
    videoBox.classList.remove('visible');
    wordRes.innerHTML = '';
    legendEl.style.display = 'none';
    setStatus('<span class="spinner"></span>Generating… (this may take a minute)');

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });

      const data = await res.json();

      if (!res.ok) {
        const detail = data.detail;
        const msg = typeof detail === 'object'
          ? detail.message
          : (detail || `Server error ${res.status}`);
        setStatus(`Error: ${msg}`, true);
        if (typeof detail === 'object' && detail.missing) {
          renderWords(detail.missing.map(w => ({ word: w, status: 'missing' })));
        }
        return;
      }

      // Success — count by actual per-token status (numbers expand, so the
      // input-word counts would be wrong).
      const { runs = [], tokens = [], video_url } = data;
      const count = (s) => tokens.filter(t => t.status === s).length;
      const parts = [];
      if (runs.length)        parts.push(`${runs.length} real phrase${runs.length > 1 ? 's' : ''} 🎯`);
      if (count('found'))     parts.push(`${count('found')} direct`);
      if (count('spliced'))   parts.push(`${count('spliced')} phoneme-spliced 🔀`);
      if (count('missing'))   parts.push(`${count('missing')} missing`);
      setStatus(`Done — ${parts.join(', ')}`);

      renderWords(tokens);

      // Show video
      videoEl.src = video_url;
      dlLink.href = video_url;
      dlLink.download = video_url.split('/').pop();
      videoBox.classList.add('visible');
      videoEl.load();
      videoEl.play().catch(() => {});   // autoplay may be blocked — that's fine

      loadStats(); // refresh stats after generation

    } catch (err) {
      setStatus(`Network error: ${err.message}`, true);
    } finally {
      submitBtn.disabled = false;
    }
  });

  // ── Allow Ctrl+Enter to submit ───────────────────────────────────────────────
  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      form.dispatchEvent(new Event('submit'));
    }
  });

  // ── Autocomplete: pull words & real phrases from the corpus ─────────────────
  const suggestBox = document.getElementById('suggest-box');
  const wordCheck  = document.getElementById('word-check');

  let vocab = null;                 // word → clip count (full corpus)
  fetch('/api/words')
    .then(r => r.ok ? r.json() : null)
    .then(d => { if (d) { vocab = d.words; checkWords(); } })
    .catch(() => {});

  // Mirror the backend tokeniser: strip non-word chars, lowercase.
  const cleanWord = (t) => t.replace(/[^\w]/g, '').toLowerCase();

  // Split the text before the caret into (context words, partial word, start
  // offset of the partial word) for suggestion queries and acceptance.
  function caretParts() {
    const pos    = textInput.selectionStart;
    const before = textInput.value.slice(0, pos);
    const m      = before.match(/[^\s]*$/);
    const partial = m ? m[0] : '';
    return {
      context: before.slice(0, before.length - partial.length),
      partial,
      start: pos - partial.length,
      pos,
    };
  }

  let items = [];        // current suggestions [{word, kind, meta}]
  let active = -1;       // keyboard-highlighted row (-1 = none)
  let fetchSeq = 0;      // discard stale responses
  let debounceTimer = null;

  function closeSuggest() {
    suggestBox.classList.remove('open');
    suggestBox.innerHTML = '';
    items = [];
    active = -1;
  }

  function renderSuggest() {
    if (!items.length) { closeSuggest(); return; }
    suggestBox.innerHTML = '';
    items.forEach((it, i) => {
      const row = document.createElement('div');
      row.className = `suggest-item ${it.kind}` + (i === active ? ' active' : '');
      row.innerHTML =
        `<span class="s-word"></span><span class="s-meta">${it.meta}</span>`;
      row.querySelector('.s-word').textContent = it.word;
      row.addEventListener('mousedown', (e) => {  // mousedown: before blur
        e.preventDefault();
        accept(i);
      });
      suggestBox.appendChild(row);
    });
    suggestBox.classList.add('open');
  }

  function accept(i) {
    const it = items[i];
    if (!it) return;
    const { start, pos } = caretParts();
    const val = textInput.value;
    textInput.value = val.slice(0, start) + it.word + ' ' + val.slice(pos);
    const newPos = start + it.word.length + 1;
    textInput.setSelectionRange(newPos, newPos);
    closeSuggest();
    checkWords();
    queueSuggest();          // immediately offer the next continuation
  }

  function queueSuggest() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(fetchSuggest, 120);
  }

  async function fetchSuggest() {
    const { context, partial } = caretParts();
    const prefix = cleanWord(partial);
    const ctxWords = context.trim();
    if (!prefix && !ctxWords) { closeSuggest(); return; }

    const seq = ++fetchSeq;
    try {
      const params = new URLSearchParams({ context: ctxWords, prefix, limit: 8 });
      const r = await fetch('/api/suggest?' + params);
      if (!r.ok || seq !== fetchSeq) return;
      const d = await r.json();

      const next = [];
      (d.continuations || []).forEach(c => next.push({
        word: c.word, kind: 'phrase',
        meta: `phrase ×${c.sources}`,
      }));
      (d.words || []).forEach(w => next.push({
        word: w.word, kind: 'vocab',
        meta: `${w.clips} clip${w.clips > 1 ? 's' : ''}`,
      }));
      // Without a prefix only phrase continuations are useful noise-free.
      items = next.slice(0, 8);
      active = -1;
      renderSuggest();
    } catch { /* ignore */ }
  }

  // Words typed so far that have no direct clip (will splice or go missing).
  function checkWords() {
    if (!vocab) return;
    const { context } = caretParts();
    const unknown = [];
    for (const tok of context.split(/\s+/)) {
      if (!tok || /^\*[A-Za-z]+\*$/.test(tok)) continue;   // *noise* tokens
      const w = cleanWord(tok);
      if (!w || /^\d+$/.test(w)) continue;                 // digits expand
      if (!(w in vocab) && !unknown.includes(w)) unknown.push(w);
    }
    wordCheck.innerHTML = unknown.length
      ? `no direct clip (will try phoneme splice): ` +
        unknown.map(w => `<span class="unknown"></span>`).join(', ')
      : '';
    if (unknown.length) {
      wordCheck.querySelectorAll('.unknown').forEach((el, i) => {
        el.textContent = unknown[i];
      });
    }
  }

  textInput.addEventListener('input', () => { queueSuggest(); checkWords(); });
  textInput.addEventListener('blur', () => setTimeout(closeSuggest, 150));

  textInput.addEventListener('keydown', (e) => {
    if (!items.length || !suggestBox.classList.contains('open')) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      active = (active + 1) % items.length;
      renderSuggest();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      active = (active - 1 + items.length) % items.length;
      renderSuggest();
    } else if (e.key === 'Tab') {
      e.preventDefault();
      accept(active >= 0 ? active : 0);     // Tab takes the top suggestion
    } else if (e.key === 'Enter' && active >= 0 && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();                   // Enter only when explicitly chosen
      accept(active);
    } else if (e.key === 'Escape') {
      closeSuggest();
    }
  });
</script>
</body>
</html>
