<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YTP Machine</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Impact&family=VT323&family=Roboto+Mono:wght@400;700&display=swap');

    :root {
      --yellow: #ffe500;
      --green:  #00ff88;
      --red:    #ff3c3c;
      --dark:   #0d0d0d;
      --panel:  #141414;
      --border: #2a2a2a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark);
      color: #e8e8e8;
      font-family: 'Roboto Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    header h1 {
      font-family: Impact, 'Arial Black', sans-serif;
      font-size: clamp(2.5rem, 8vw, 5rem);
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--yellow);
      text-shadow:
        3px  3px 0 #b3a000,
       -2px -2px 0 #000,
        2px -2px 0 #000,
       -2px  2px 0 #000;
      line-height: 1;
    }
    header p {
      color: #888;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      letter-spacing: 1px;
    }

    /* ── Stats bar ── */
    #stats-bar {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      font-size: 0.75rem;
      color: #555;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    #stats-bar span { color: var(--yellow); }
    /* The readouts are ambient; the voice picker is the one control up here,
       so it gets a divider and the stats get pushed back a shade. */
    /* Each reading wraps as a unit. Without this the row breaks wherever it
       runs out of width, so on a phone "video sources: 48" split across two
       lines with the label orphaned from its number. */
    #stats-bar .stat { color: #4a4a4a; white-space: nowrap; }
    #corpus-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-right: 1.25rem;
      border-right: 1px solid var(--border);
      color: #777;
    }

    /* A native select was the one control on the page still wearing the
       operating system's clothes -- grey, rounded, and obviously bolted on to
       everything around it. */
    #corpus-select {
      appearance: none;
      -webkit-appearance: none;
      font: inherit;
      font-size: 0.75rem;
      color: var(--yellow);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.3rem 1.75rem 0.3rem 0.6rem;
      cursor: pointer;
      /* The arrow, drawn rather than inherited. */
      background-image:
        linear-gradient(45deg, transparent 50%, #777 50%),
        linear-gradient(135deg, #777 50%, transparent 50%);
      background-position:
        calc(100% - 14px) calc(50% + 1px),
        calc(100% - 9px)  calc(50% + 1px);
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    #corpus-select:hover { border-color: #3d3d3d; }
    #corpus-select:focus-visible { outline: 2px solid var(--yellow); outline-offset: 1px; }
    #corpus-select:disabled { opacity: 0.5; cursor: wait; }
    #corpus-select option { background: var(--panel); color: #e8e8e8; }

    /* ── Main card ── */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.75rem;
      width: 100%;
      max-width: 700px;
    }

    /* ── Input area ── */
    #form { display: flex; flex-direction: column; gap: 1rem; }

    #text-input {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e8e8e8;
      font-family: 'Roboto Mono', monospace;
      font-size: 1.1rem;
      line-height: 1.6;
      padding: 0.85rem 1rem;
      resize: vertical;
      min-height: 90px;
      transition: border-color 0.15s;
    }
    #text-input:focus {
      outline: none;
      border-color: var(--yellow);
    }
    #text-input::placeholder { color: #444; }

    /* The button used to sit alone against the right edge with a wide empty
       gap beside it. Pairing it with a live read of the input fills that space
       with something worth knowing and gives the row a left edge. */
    #form-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    #input-meter {
      font-size: 0.72rem;
      color: #4a4a4a;
      letter-spacing: 0.3px;
      transition: color 0.2s;
    }
    #input-meter.warn { color: #ffaa00; }
    #input-meter b { color: #8a8a8a; font-weight: 400; }
    #input-meter.warn b { color: #ffaa00; }

    #submit-btn {
      background: var(--yellow);
      border: none;
      border-radius: 6px;
      color: #000;
      cursor: pointer;
      font-family: Impact, sans-serif;
      font-size: 1.2rem;
      letter-spacing: 1.5px;
      padding: 0.65rem 2rem;
      text-transform: uppercase;
      transition: transform 0.1s, background 0.15s;
    }
    #submit-btn:hover { background: #ffd000; }
    #submit-btn:active { transform: scale(0.97); }
    #submit-btn:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Narrow screens ──
       There were no media queries at all, so on a phone the stats bar wrapped
       into a ragged pile, the button kept a desktop-sized gap beside it, and
       the body padding ate a third of the width. */
    @media (max-width: 640px) {
      body { padding: 1.25rem 0.75rem 3rem; }
      header { margin-bottom: 1.5rem; }
      .card { padding: 1rem; border-radius: 8px; }

      /* Stack the picker above the readouts and drop the divider, which only
         makes sense when the two sit side by side. */
      #stats-bar {
        flex-direction: column;
        gap: 0.6rem;
        align-items: stretch;
        margin-bottom: 1.25rem;
      }
      #corpus-wrap {
        border-right: none;
        padding-right: 0;
        justify-content: space-between;
      }
      #corpus-select { flex: 1; min-width: 0; }
      #stats-row {
        display: flex;
        /* Wrapping belongs here, not on the bar outside it: the bar wraps its
           own children, but all three readings live in this one row, so
           without it they are a single unwrappable item and the row simply
           runs off both edges of a phone. */
        flex-wrap: wrap;
        justify-content: center;
        min-width: 0;
        gap: 0.35rem 0.75rem;
      }

      /* Full-width target: a 2rem-padded button is a small thing to hit with a
         thumb, and there is nothing to sit beside it at this width. */
      #form-footer { flex-direction: column-reverse; align-items: stretch; }
      #submit-btn { width: 100%; padding: 0.85rem 1rem; }
      #input-meter { text-align: center; }

      #text-input { font-size: 1rem; min-height: 120px; }
      #word-check { max-height: 6rem; }
    }

    /* Landscape phones and small tablets: keep the row, tighten it. */
    @media (min-width: 641px) and (max-width: 900px) {
      body { padding: 1.5rem 1rem 3rem; }
      #stats-bar { gap: 0.9rem; font-size: 0.7rem; }
    }

    /* Someone who prefers less motion gets no sliding bar and no spinner. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ── Autocomplete ── */
    #input-wrap { position: relative; width: 100%; }
    #input-wrap #text-input { display: block; width: 100%; }

    #suggest-box {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      z-index: 10;
      background: #1a1a1a;
      border: 1px solid #333;
      border-top: none;
      border-radius: 0 0 6px 6px;
      max-height: 240px;
      overflow-y: auto;
      display: none;
    }
    #suggest-box.open { display: block; }

    .suggest-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.4rem 1rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .suggest-item:hover, .suggest-item.active { background: #262626; }
    .suggest-item .s-word { color: #e8e8e8; }
    .suggest-item .s-meta {
      font-size: 0.7rem;
      border-radius: 3px;
      padding: 0.1rem 0.45rem;
      white-space: nowrap;
    }
    .suggest-item.phrase .s-meta { background: #06263a; color: #7dd3fc; border: 1px solid #0e4a6e; }
    .suggest-item.vocab  .s-meta { background: #003d1f; color: var(--green); border: 1px solid #005a2c; }

    /* ── Live word check ── */
    #word-check {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: #555;
      min-height: 1.1em;
      letter-spacing: 0.3px;
      /* Hard ceiling. Expanding the full list on a long passage must not be
         able to push the button and the progress bar off the bottom of the
         page -- it scrolls inside itself instead. */
      max-height: 8.5rem;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    #word-check .unknown { color: #ffaa00; }
    .more-words {
      font: inherit;
      font-size: inherit;
      background: none;
      border: none;
      padding: 0;
      color: #777;
      text-decoration: underline dotted;
      cursor: pointer;
    }
    .more-words:hover { color: var(--yellow); }

    /* ── Status ── */
    #status {
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: #888;
      min-height: 1.2em;
      letter-spacing: 0.5px;
    }
    #status.error { color: var(--red); }

    /* Progress. There is real per-word and per-chunk data behind this now, so
       showing a bar is honest rather than decorative -- it moves because work
       happened, not on a timer. */
    #progress {
      display: none;
      margin-top: 0.75rem;
    }
    #progress.on { display: block; }
    #progress-track {
      height: 4px;
      background: #1f1f1f;
      border-radius: 2px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      width: 0;
      background: var(--yellow);
      border-radius: 2px;
      transition: width 0.25s ease-out;
    }
    /* Queued work has no measurable progress, so the bar says "something is
       happening" rather than claiming a percentage it does not have. */
    #progress.indeterminate #progress-bar {
      width: 35%;
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(340%); }
    }
    #progress-note {
      margin-top: 0.4rem;
      font-size: 0.7rem;
      color: #555;
      letter-spacing: 0.3px;
    }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #444;
      border-top-color: var(--yellow);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Word tags ── */
    #word-results {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    /* Before the first generation this is empty but still laid out, and a
       margin on an empty flex box is real space -- the neighbouring panels are
       display:none so theirs collapse, which is why this was the only one
       leaving a gap under the button. */
    #word-results:empty { margin-top: 0; }
    .word-tag {
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      text-transform: lowercase;
      letter-spacing: 0.5px;
    }
    .word-tag.found   { background: #003d1f; color: var(--green);  border: 1px solid #005a2c; }
    .word-tag.run     { background: #06263a; color: #7dd3fc;       border: 1px solid #0e4a6e; }
    .word-tag.spliced { background: #3d2800; color: #ffaa00;       border: 1px solid #5a3d00; }
    .word-tag.missing { background: #3d0000; color: var(--red);    border: 1px solid #5a0000; }

    .word-tag .vote {
      margin-left: 0.3rem;
      padding: 0;
      border: none;
      background: none;
      color: inherit;
      font-size: 0.75rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.35;
      transition: opacity 0.12s, transform 0.12s;
    }
    .word-tag .vote:hover  { opacity: 1; transform: scale(1.25); }
    .word-tag .vote:disabled { cursor: default; }

    /* The vote that is currently in force stays lit; the other stays dim, so a
       glance over the row shows what has been rated without a tooltip. */
    .word-tag .vote.active { opacity: 1; }
    .word-tag.voted-down { opacity: 0.5; }
    .word-tag.voted-up   { box-shadow: 0 0 0 1px currentColor inset; }

    @media (prefers-reduced-motion: reduce) {
      .word-tag .vote { transition: none; }
      .word-tag .vote:hover { transform: none; }
    }

    /* Touch pointers get no hover to reveal the controls, so keep them legible
       and comfortably tappable rather than 12px targets at 35% opacity. */
    @media (hover: none) {
      .word-tag .vote { opacity: 0.7; font-size: 0.85rem; padding: 0.15rem; }
    }

    /* ── Legend ── */
    #legend {
      margin-top: 0.75rem;
      font-size: 0.7rem;
      color: #555;
      display: flex;
      gap: 1rem;
    }
    #legend .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
    #legend .dot.found   { background: var(--green); }
    #legend .dot.run     { background: #7dd3fc; }
    #legend .dot.spliced { background: #ffaa00; }
    #legend .dot.missing { background: var(--red); }

    /* ── Video player ── */
    #video-container {
      margin-top: 2rem;
      display: none;
    }
    #video-container.visible { display: block; }

    #video-container h2 {
      font-family: Impact, sans-serif;
      font-size: 1.1rem;
      color: var(--yellow);
      letter-spacing: 1px;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
    }

    #output-video {
      width: 100%;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #000;
      display: block;
    }

    #download-link {
      display: inline-block;
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--yellow);
      text-decoration: none;
      border: 1px solid var(--yellow);
      border-radius: 4px;
      padding: 0.3rem 0.8rem;
      transition: background 0.15s;
    }
    #download-link:hover { background: rgba(255,229,0,0.1); }

    /* ── Footer ── */
    footer {
      margin-top: 3rem;
      color: #333;
      font-size: 0.7rem;
      text-align: center;
      line-height: 1.8;
    }
    footer a { color: #555; }
  </style>
</head>
<body>

<header>
  <h1>YTP Machine</h1>
</header>

<div id="stats-bar">
  <div id="corpus-wrap" style="display:none">voice:
    <select id="corpus-select"></select>
  </div>
  <div id="stats-row">
    <div class="stat">clips in database: <span id="stat-clips">—</span></div>
    <div class="stat">unique words: <span id="stat-words">—</span></div>
    <div class="stat">video sources: <span id="stat-sources">—</span></div>
  </div>
</div>

<div class="card">
  <form id="form" autocomplete="off">
    <div id="input-wrap">
      <textarea
        id="text-input"
        name="text"
        rows="3"
        placeholder="nice rice … or perhaps some chocolate cake"
        spellcheck="false"
        autocomplete="off"
      ></textarea>
      <div id="suggest-box"></div>
    </div>
    <div id="word-check"></div>
    <div id="form-footer">
      <div id="input-meter"></div>
      <button type="submit" id="submit-btn">GENERATE</button>
    </div>
  </form>

  <div id="status"></div>
  <div id="progress">
    <div id="progress-track"><div id="progress-bar"></div></div>
    <div id="progress-note"></div>
  </div>
  <div id="word-results"></div>
  <div id="legend" style="display:none">
    <span><span class="dot run"></span> real phrase</span>
    <span><span class="dot found"></span> direct match</span>
    <span><span class="dot spliced"></span> phoneme splice</span>
    <span><span class="dot missing"></span> missing</span>
  </div>

  <div id="video-container">
    <h2>Result</h2>
    <video id="output-video" controls playsinline></video>
    <br>
    <a id="download-link" download>Download .mp4</a>
  </div>
</div>


<script>
  const form       = document.getElementById('form');
  const textInput  = document.getElementById('text-input');
  const submitBtn  = document.getElementById('submit-btn');
  const statusEl   = document.getElementById('status');
  const wordRes    = document.getElementById('word-results');
  const legendEl   = document.getElementById('legend');
  const videoBox   = document.getElementById('video-container');
  const videoEl    = document.getElementById('output-video');
  const dlLink     = document.getElementById('download-link');

  // ── Load stats ──────────────────────────────────────────────────────────────
  async function loadStats() {
    try {
      const r = await fetch('/api/stats');
      if (!r.ok) return;
      const d = await r.json();
      document.getElementById('stat-clips').textContent   = d.total_clips.toLocaleString();
      document.getElementById('stat-words').textContent   = d.unique_words.toLocaleString();
      document.getElementById('stat-sources').textContent = d.sources.toLocaleString();
    } catch { /* ignore */ }
  }
  loadStats();

  // ── Corpora ─────────────────────────────────────────────────────────────────
  // The selector only appears when there is more than one installed: a single
  // corpus needs no choosing, and an empty dropdown is worse than none.
  const corpusWrap   = document.getElementById('corpus-wrap');
  const corpusSelect = document.getElementById('corpus-select');

  async function loadCorpora() {
    try {
      const r = await fetch('/api/corpora');
      if (!r.ok) return;
      const d = await r.json();
      if (!d.corpora || d.corpora.length < 2) return;
      corpusSelect.innerHTML = '';
      for (const c of d.corpora) {
        const opt = document.createElement('option');
        opt.value = c.slug;
        opt.textContent = c.error ? `${c.name} (unreadable)` : `${c.name} — ${(c.words || 0).toLocaleString()} words`;
        opt.disabled = !!c.error;
        if (c.active) opt.selected = true;
        corpusSelect.appendChild(opt);
      }
      corpusWrap.style.display = '';
    } catch { /* ignore */ }
  }

  corpusSelect.addEventListener('change', async () => {
    const slug = corpusSelect.value;
    corpusSelect.disabled = true;
    try {
      const r = await fetch('/api/corpus', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug }),
      });
      if (!r.ok) throw new Error('switch failed');
      // The vocabulary belongs to the old corpus; everything derived from it
      // has to be rebuilt or the word checker will lie about what is available.
      await loadStats();
      await loadWords();
    } catch {
      await loadCorpora();   // put the selector back where it really is
    } finally {
      corpusSelect.disabled = false;
    }
  });

  loadCorpora();

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function setStatus(msg, isError = false) {
    statusEl.className = isError ? 'error' : '';
    statusEl.innerHTML = msg;
  }

  // Render the exact spoken words in order, coloured by status.  Uses the
  // backend's token list so expanded numbers ("42" → forty two) and every
  // splice/miss are shown accurately rather than guessed from the input.
  const TITLES = {
    run:     'spoken as one continuous clip',
    found:   'direct match',
    spliced: 'built from phoneme segments',
    missing: 'not in the corpus',
  };
  function renderWords(tokens) {
    wordRes.innerHTML = '';
    if (!tokens || !tokens.length) return;
    tokens.forEach(t => {
      const cls = ['run', 'found', 'spliced', 'missing'].includes(t.status) ? t.status : 'missing';
      const tag = document.createElement('span');
      tag.className = 'word-tag ' + cls;
      tag.title = TITLES[cls];

      const label = document.createElement('span');
      label.textContent = t.word;
      tag.appendChild(label);

      // Any word that came from a clip can be rated, not just phoneme splices:
      // a plain found clip can be just as bad a take, and rating it down used
      // to be impossible because the backend never sent an id for one.
      if (cls !== 'missing' && Array.isArray(t.clips) && t.clips.length) {
        tag.appendChild(voteButton(t, tag, +1, '👍', 'Use these clips more for this word'));
        tag.appendChild(voteButton(t, tag, -1, '👎', 'Use these clips less for this word'));
      }
      wordRes.appendChild(tag);
    });
    legendEl.style.display = 'flex';
  }

  function voteButton(token, tag, dir, glyph, title) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'vote';
    btn.dataset.dir = String(dir);
    btn.textContent = glyph;
    btn.title = title;
    btn.setAttribute('aria-label', `${dir > 0 ? 'Upvote' : 'Downvote'} ${token.word}`);
    btn.addEventListener('click', () => castVote(token, tag, btn, dir));
    return btn;
  }

  // Votes are a weighting, not a ban — a downvoted clip becomes rare rather
  // than forbidden, so the word can still be produced when it is the only clip
  // there is. Clicking the same arrow again clears the vote.
  async function castVote(token, tag, btn, dir) {
    const current = Number(tag.dataset.vote || 0);
    const rating  = current === dir ? 0 : dir;
    const buttons = tag.querySelectorAll('.vote');

    buttons.forEach(b => { b.disabled = true; });
    try {
      const r = await fetch('/api/rate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ word: token.word, clips: token.clips, rating }),
      });
      if (!r.ok) throw new Error(String(r.status));

      tag.dataset.vote = String(rating);
      tag.classList.toggle('voted-up',   rating > 0);
      tag.classList.toggle('voted-down', rating < 0);
      buttons.forEach(b => {
        b.classList.toggle('active', rating !== 0 && Number(b.dataset.dir) === rating);
      });
      tag.title = rating > 0 ? 'Preferred — picked more often from now on'
                : rating < 0 ? 'Rated down — picked less often from now on'
                : TITLES[[...tag.classList].find(c => TITLES[c])] || tag.title;
    } catch {
      /* leave the tag as it was; the buttons are re-enabled below */
    } finally {
      buttons.forEach(b => { b.disabled = false; });
    }
  }

  // ── Submit ───────────────────────────────────────────────────────────────────
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = textInput.value.trim();
    if (!text) return;

    // Reset UI
    generating = true;
    submitBtn.disabled = true;
    videoBox.classList.remove('visible');
    wordRes.innerHTML = '';
    legendEl.style.display = 'none';
    // The suggestion dropdown is absolutely positioned under the textarea, so
    // left open it sits on top of the word-check line underneath and hides
    // half of it while the job runs.
    closeSuggest();
    setStatus('<span class="spinner"></span>Generating… (this may take a minute)');

    try {
      // Submitting queues the job and returns immediately. Generation used to
      // run inside this request; a long sentence outlasted the proxy, which
      // answered 504 while the work carried on where nobody could collect it.
      const res = await fetchJson('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (res.error) { setStatus(`Error: ${res.error}`, true); return; }
      if (!res.ok) {
        const detail = res.data.detail;
        const msg = typeof detail === 'object' ? detail.message
                                               : (detail || `Server error ${res.status}`);
        setStatus(`Error: ${msg}`, true);
        if (typeof detail === 'object' && detail.missing) {
          renderWords(detail.missing.map(w => ({ word: w, status: 'missing' })));
        }
        return;
      }

      const data = await pollJob(res.data.id, res.data.position ?? 0);
      if (data === null) return;   // pollJob has already reported why

      // Success — count by actual per-token status (numbers expand, so the
      // input-word counts would be wrong).
      const { runs = [], tokens = [], video_url } = data;
      const count = (s) => tokens.filter(t => t.status === s).length;
      const parts = [];
      if (runs.length)        parts.push(`${runs.length} real phrase${runs.length > 1 ? 's' : ''} 🎯`);
      if (count('found'))     parts.push(`${count('found')} direct`);
      if (count('spliced'))   parts.push(`${count('spliced')} phoneme-spliced 🔀`);
      if (count('missing'))   parts.push(`${count('missing')} missing`);
      setStatus(`Done — ${parts.join(', ')}`);

      renderWords(tokens);

      // Show video
      videoEl.src = video_url;
      dlLink.href = video_url;
      dlLink.download = video_url.split('/').pop();
      videoBox.classList.add('visible');
      videoEl.load();
      videoEl.play().catch(() => {});   // autoplay may be blocked — that's fine

      loadStats(); // refresh stats after generation

    } catch (err) {
      setStatus(`Network error: ${err.message}`, true);
    } finally {
      generating = false;
      updateMeter();   // re-enables the button, unless the box is now empty
    }
  });

  // ── Talking to the queue ────────────────────────────────────────────────────
  // Every response goes through here so a non-JSON body -- a proxy timeout, a
  // gateway error page -- is reported as what it is rather than surfacing as
  // "JSON.parse: unexpected character at line 1 column 1".
  async function fetchJson(url, opts) {
    let r;
    try {
      r = await fetch(url, opts);
    } catch (e) {
      return { error: `could not reach the server (${e.message})` };
    }
    const raw = await r.text();
    try {
      return { ok: r.ok, status: r.status, data: JSON.parse(raw) };
    } catch {
      return {
        error: `the server replied with ${r.status} and something that isn't JSON` +
               (raw.trim() ? ` — ${raw.trim().slice(0, 120)}` : ''),
      };
    }
  }

  const STAGE_TEXT = {
    waiting:   'waiting to start',
    loading:   'loading the corpus',
    resolving: 'finding clips',
    encoding:  'encoding video',
    joining:   'joining the parts',
    finished:  'finishing up',
  };

  const progressEl  = document.getElementById('progress');
  const progressBar = document.getElementById('progress-bar');
  const progressNote = document.getElementById('progress-note');

  function showProgress(fraction, note) {
    progressEl.classList.add('on');
    if (fraction === null) {
      progressEl.classList.add('indeterminate');
      progressBar.style.width = '';
    } else {
      progressEl.classList.remove('indeterminate');
      progressBar.style.width = `${Math.round(Math.min(1, Math.max(0, fraction)) * 100)}%`;
    }
    progressNote.textContent = note || '';
  }

  function hideProgress() {
    progressEl.classList.remove('on', 'indeterminate');
    progressBar.style.width = '0';
    progressNote.textContent = '';
  }

  // Poll until the job resolves. Backs off from a quarter second to two, so a
  // short job feels instant and a long one is not asking every 250ms for
  // minutes on end.
  async function pollJob(id, position) {
    let delay = 250;
    if (position > 0) setStatus(`<span class="spinner"></span>Queued — ${position} ahead`);
    for (;;) {
      await new Promise(r => setTimeout(r, delay));
      delay = Math.min(delay * 1.4, 2000);

      const res = await fetchJson(`/api/jobs/${id}`);
      if (res.error) { hideProgress(); setStatus(`Error: ${res.error}`, true); return null; }
      if (!res.ok) {
        hideProgress();
        const d = res.data.detail;
        setStatus(`Error: ${(typeof d === 'object' ? d.message : d) || 'job lost'}`, true);
        return null;
      }

      const j = res.data;
      if (j.status === 'error') {
        hideProgress();
        setStatus(`Error: ${j.error}`, true);
        if (j.missing) renderWords(j.missing.map(w => ({ word: w, status: 'missing' })));
        return null;
      }
      if (j.status === 'done') { hideProgress(); return j.result; }

      if (j.status === 'queued') {
        // One job runs at a time, so a queued job is usually waiting on
        // somebody else's. Saying only "Queued" left you watching a spinner
        // with no idea whether anything was happening at all.
        const ahead = j.position ?? 0;
        const waited = j.queued_for ? ` · waiting ${Math.round(j.queued_for)}s` : '';
        setStatus(
          `<span class="spinner"></span>Queued${ahead ? ` — ${ahead} ahead of you` : ' behind another job'}`
        );
        showProgress(null, `one job runs at a time${waited}`);
      } else {
        const label = STAGE_TEXT[j.stage] || j.stage;
        const secs = j.running_for ? ` · ${Math.round(j.running_for)}s` : '';
        setStatus(`<span class="spinner"></span>${label}${secs}`);

        // Resolving is per word and encoding is per chunk, so the two stages
        // get their own share of the bar rather than each restarting it at 0.
        if (j.stage === 'resolving' && j.total > 0) {
          showProgress(0.1 + 0.7 * (j.done / j.total), `${j.done} of ${j.total} words`);
        } else if (j.stage === 'encoding' || j.stage === 'joining') {
          const within = j.total > 1 ? j.done / j.total : 0.5;
          showProgress(0.8 + 0.2 * within,
                       j.total > 1 ? `part ${j.done + 1} of ${j.total}` : 'encoding');
        } else {
          showProgress(0.05, STAGE_TEXT[j.stage] || '');
        }
      }
    }
  }

  // ── Allow Ctrl+Enter to submit ───────────────────────────────────────────────
  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      form.dispatchEvent(new Event('submit'));
    }
  });

  // ── Autocomplete: pull words & real phrases from the corpus ─────────────────
  const suggestBox = document.getElementById('suggest-box');
  const wordCheck  = document.getElementById('word-check');

  let vocab = null;                 // word → clip count (active corpus)
  let generating = false;           // a job of ours is in flight

  // A named declaration, not an inline fetch, because switching corpus has to
  // be able to pull the vocabulary again -- the old one describes a different
  // set of videos and would report words as available that this corpus has
  // never heard. Hoisted, so the corpus selector above can call it.
  async function loadWords() {
    try {
      const r = await fetch('/api/words');
      if (!r.ok) return;
      const d = await r.json();
      vocab = d.words;
      checkWords();
      updateMeter();   // the splice count needs the vocabulary to mean anything
    } catch { /* ignore */ }
  }
  loadWords();

  // Mirror the backend tokeniser: strip non-word chars, lowercase.
  const cleanWord = (t) => t.replace(/[^\w]/g, '').toLowerCase();

  // Mirrors _expand_token in app/generate.py, minus the number spelling:
  // numeric parts are skipped here, exactly as they were before, because they
  // always expand to ordinary counting words the corpus has.
  //
  // Duplicated on purpose. This runs on every keystroke to say how much
  // splicing is coming, and a round trip per keystroke would cost more than
  // it is worth. If it drifts from the backend the symptom is a wrong count
  // on one line -- the video is tokenised server-side and is unaffected.
  const UNIT_WORDS = {
    km: 'kilometers', kmh: 'kilometers per hour', kph: 'kilometers per hour',
    mph: 'miles per hour', kg: 'kilograms', hp: 'horsepower', kw: 'kilowatts',
    nm: 'newton metres', mm: 'millimeters', cm: 'centimeters', ml: 'millilitres',
  };
  // No 's' for seconds: "80s" is a decade far more often than eighty seconds.
  const UNITS_AFTER_NUM = {
    l: 'litres', m: 'meters', g: 'grams', k: 'thousand', t: 'tonnes',
  };
  const DECADES = {
    20: 'twenties', 30: 'thirties', 40: 'forties', 50: 'fifties',
    60: 'sixties', 70: 'seventies', 80: 'eighties', 90: 'nineties',
  };
  const PER_UNITS = {
    h: 'hour', hr: 'hour', s: 'second', sec: 'second', min: 'minute',
    km: 'kilometre', '100km': 'hundred kilometers', l: 'litre', kg: 'kilogram', m: 'metre',
  };
  const ABBREV = { mk: 'mark' };
  const STRIP = /^[.,!?;:'"()\[\]]+|[.,!?;:'"()\[\]]+$/g;

  function checkableWords(tok) {
    const out = [];
    // What the corpus says beats what the rules would make of it: it holds
    // clips labelled "v8" and "80s", and expanding those walks away from a
    // recording of the exact thing being asked for.
    const raw = tok.replace(/[^\w]/g, '').toLowerCase();
    if (raw && vocab && (raw in vocab)) return [raw];

    const rate = tok.replace(STRIP, '').toLowerCase().match(/^([a-z]+)\/(\d*[a-z]+)$/);
    if (rate && PER_UNITS[rate[2]] && (UNIT_WORDS[rate[1]] || UNITS_AFTER_NUM[rate[1]])) {
      const top = UNIT_WORDS[rate[1]] || UNITS_AFTER_NUM[rate[1]];
      return [...top.split(' '), 'per', ...PER_UNITS[rate[2]].split(' ')]
        .filter(w => !/^\d+$/.test(w));
    }
    for (let atom of tok.split(/[/–—-]+/)) {
      atom = atom.replace(/^[$£€]/, '').replace(/%$/, '').replace(STRIP, '').toLowerCase();
      if (!atom) continue;
      if (/^\d+(\.\d+)?$/.test(atom)) continue;          // a number: always expands
      if (/^\d+(st|nd|rd|th)$/.test(atom)) continue;      // an ordinal: likewise
      if (/^\d+x\d+$/.test(atom)) { out.push('by'); continue; }   // 4x4 -> four by four
      const dec = atom.match(/^(?:19|20)?(\d0)s$/);               // 80s -> eighties
      if (dec && DECADES[dec[1]]) { out.push(DECADES[dec[1]]); continue; }
      if (UNIT_WORDS[atom]) { out.push(...UNIT_WORDS[atom].split(' ')); continue; }
      if (ABBREV[atom]) { out.push(ABBREV[atom]); continue; }
      const parts = atom.match(/\d+|[a-z]+/g) || [];
      if (parts.length > 1) {
        let afterNum = false;
        for (const p of parts) {
          if (/^\d+$/.test(p)) { afterNum = true; continue; }
          if (UNIT_WORDS[p]) out.push(...UNIT_WORDS[p].split(' '));
          else if (afterNum && UNITS_AFTER_NUM[p]) out.push(...UNITS_AFTER_NUM[p].split(' '));
          else if (ABBREV[p]) out.push(ABBREV[p]);
          else out.push(p);
          afterNum = false;
        }
        continue;
      }
      const w = atom.replace(/[^\w]/g, '');
      if (w) out.push(w);
    }
    return out;
  }

  // Split the text before the caret into (context words, partial word, start
  // offset of the partial word) for suggestion queries and acceptance.
  function caretParts() {
    const pos    = textInput.selectionStart;
    const before = textInput.value.slice(0, pos);
    const m      = before.match(/[^\s]*$/);
    const partial = m ? m[0] : '';
    return {
      context: before.slice(0, before.length - partial.length),
      partial,
      start: pos - partial.length,
      pos,
    };
  }

  let items = [];        // current suggestions [{word, kind, meta}]
  let active = -1;       // keyboard-highlighted row (-1 = none)
  let fetchSeq = 0;      // discard stale responses
  let debounceTimer = null;

  function closeSuggest() {
    suggestBox.classList.remove('open');
    suggestBox.innerHTML = '';
    items = [];
    active = -1;
  }

  function renderSuggest() {
    if (!items.length) { closeSuggest(); return; }
    suggestBox.innerHTML = '';
    items.forEach((it, i) => {
      const row = document.createElement('div');
      row.className = `suggest-item ${it.kind}` + (i === active ? ' active' : '');
      row.innerHTML =
        `<span class="s-word"></span><span class="s-meta">${it.meta}</span>`;
      row.querySelector('.s-word').textContent = it.word;
      row.addEventListener('mousedown', (e) => {  // mousedown: before blur
        e.preventDefault();
        accept(i);
      });
      suggestBox.appendChild(row);
    });
    suggestBox.classList.add('open');
  }

  function accept(i) {
    const it = items[i];
    if (!it) return;
    const { start, pos } = caretParts();
    const val = textInput.value;
    textInput.value = val.slice(0, start) + it.word + ' ' + val.slice(pos);
    const newPos = start + it.word.length + 1;
    textInput.setSelectionRange(newPos, newPos);
    closeSuggest();
    checkWords();
    queueSuggest();          // immediately offer the next continuation
  }

  function queueSuggest() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(fetchSuggest, 120);
  }

  async function fetchSuggest() {
    const { context, partial } = caretParts();
    const prefix = cleanWord(partial);
    const ctxWords = context.trim();
    if (!prefix && !ctxWords) { closeSuggest(); return; }

    const seq = ++fetchSeq;
    try {
      const params = new URLSearchParams({ context: ctxWords, prefix, limit: 8 });
      const r = await fetch('/api/suggest?' + params);
      if (!r.ok || seq !== fetchSeq) return;
      const d = await r.json();

      const next = [];
      (d.continuations || []).forEach(c => next.push({
        word: c.word, kind: 'phrase',
        meta: `phrase ×${c.sources}`,
      }));
      (d.words || []).forEach(w => next.push({
        word: w.word, kind: 'vocab',
        meta: `${w.clips} clip${w.clips > 1 ? 's' : ''}`,
      }));
      // Without a prefix only phrase continuations are useful noise-free.
      items = next.slice(0, 8);
      active = -1;
      renderSuggest();
    } catch { /* ignore */ }
  }

  // Words typed so far that have no direct clip (will splice or go missing).
  function checkWords() {
    if (!vocab) return;
    const { context } = caretParts();
    const unknown = [];
    for (const tok of context.split(/\s+/)) {
      if (!tok || /^\*[A-Za-z]+\*$/.test(tok)) continue;   // *noise* tokens
      for (const w of checkableWords(tok)) {
        if (!(w in vocab) && !unknown.includes(w)) unknown.push(w);
      }
    }
    // Cap what is listed. A paragraph can put several hundred words in here,
    // and printing all of them turned this line into a wall of text that grew
    // the card past the height of the screen. Past a couple of dozen the count
    // is the useful part anyway -- it says how much splicing is coming, and so
    // roughly how long the job will take -- while the words themselves are
    // there to be skimmed.
    const SHOWN = 24;
    wordCheck.innerHTML = '';
    if (!unknown.length) return;

    const head = document.createElement('span');
    head.textContent =
      `${unknown.length} word${unknown.length === 1 ? '' : 's'} with no direct clip ` +
      `(will try phoneme splice): `;
    wordCheck.appendChild(head);

    const listEl = document.createElement('span');
    const render = (all) => {
      listEl.innerHTML = '';
      const shown = all ? unknown : unknown.slice(0, SHOWN);
      shown.forEach((w, i) => {
        const el = document.createElement('span');
        el.className = 'unknown';
        el.textContent = w;
        listEl.appendChild(el);
        if (i < shown.length - 1) listEl.appendChild(document.createTextNode(', '));
      });
      if (!all && unknown.length > SHOWN) {
        const more = document.createElement('button');
        more.type = 'button';
        more.className = 'more-words';
        more.textContent = ` … and ${unknown.length - SHOWN} more`;
        more.addEventListener('click', () => render(true));
        listEl.appendChild(more);
      }
    };
    render(false);
    wordCheck.appendChild(listEl);
  }

  // ── Live read of the input ──────────────────────────────────────────────────
  // The button sat beside empty space and nothing responded until you pressed
  // it. This reacts as you type: how much there is to say, how much of it has
  // to be built out of phonemes, and roughly how long that will take -- a
  // spliced word costs a forced-alignment pass, which is where the seconds go.
  const meterEl = document.getElementById('input-meter');

  function updateMeter() {
    const text = textInput.value.trim();
    submitBtn.disabled = !text || generating;
    if (!text) { meterEl.textContent = ''; meterEl.classList.remove('warn'); return; }

    const words = text.split(/\s+/).filter(Boolean);
    let unknown = 0;
    if (vocab) {
      for (const tok of words) {
        for (const w of checkableWords(tok)) if (!(w in vocab)) unknown++;
      }
    }
    // Roughly: direct clips are quick, spliced ones are not. Calibrated on the
    // real thing rather than guessed -- 46 words with 17 splices took ~36s.
    const secs = Math.round(words.length * 0.15 + unknown * 1.6);
    const eta = secs < 5 ? 'a moment' : secs < 90 ? `~${secs}s` : `~${Math.round(secs / 60)} min`;
    const slow = secs > 45;

    meterEl.innerHTML =
      `<b>${words.length}</b> word${words.length === 1 ? '' : 's'}` +
      (vocab ? ` · <b>${unknown}</b> to splice` : '') +
      ` · ${eta}`;
    meterEl.classList.toggle('warn', slow);
  }

  textInput.addEventListener('input', () => { queueSuggest(); checkWords(); updateMeter(); });

  // Run once now the elements exist, so an empty box starts with the button
  // disabled rather than inviting a click that only produces an error.
  updateMeter();
  textInput.addEventListener('blur', () => setTimeout(closeSuggest, 150));

  textInput.addEventListener('keydown', (e) => {
    if (!items.length || !suggestBox.classList.contains('open')) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      active = (active + 1) % items.length;
      renderSuggest();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      active = (active - 1 + items.length) % items.length;
      renderSuggest();
    } else if (e.key === 'Tab') {
      e.preventDefault();
      accept(active >= 0 ? active : 0);     // Tab takes the top suggestion
    } else if (e.key === 'Enter' && active >= 0 && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();                   // Enter only when explicitly chosen
      accept(active);
    } else if (e.key === 'Escape') {
      closeSuggest();
    }
  });
</script>
</body>
</html>
