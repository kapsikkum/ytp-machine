<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YTP Machine</title>
  <link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
  <style>
    main {
      width: min(760px, 100% - 2rem);
      margin: clamp(1.25rem, 5vh, 3rem) auto 3rem;
      display: flex; flex-direction: column; gap: 1rem;
    }

    /* ── Composer ── */
    .composer { padding: 1rem; }
    #input-wrap { position: relative; }
    #text-input {
      display: block; width: 100%;
      background: transparent; border: none; resize: none;
      font-size: clamp(1.15rem, 3.2vw, 1.5rem); line-height: 1.45;
      padding: .5rem .35rem .25rem; min-height: 5.5rem; max-height: 50vh;
      caret-color: var(--yellow);
    }
    #text-input:focus-visible { outline: none; }
    #text-view {
      font-size: clamp(1.15rem, 3.2vw, 1.5rem); line-height: 1.45;
      padding: .5rem .35rem .25rem; min-height: 5.5rem; max-height: 50vh; overflow-y: auto;
      white-space: pre-wrap; overflow-wrap: anywhere; cursor: text;
    }
    #text-view:focus-visible { outline: 1px dashed var(--line-2); border-radius: 6px; }
    #text-view .fxw { color: var(--yellow); border-bottom: 1px dashed rgba(255, 229, 0, .4); }
    #text-view .fxw.voiced { color: var(--violet); border-bottom-color: rgba(167, 139, 250, .5); }
    #text-view sup { font-size: .5em; margin-left: .1em; opacity: .75; }
    #text-input::placeholder { color: #3e3e45; }

    /* Live read of what will be said, word by word, as it is typed. */
    .chips { display: flex; flex-wrap: wrap; gap: .3rem; padding: .35rem .35rem .75rem; min-height: 1.9rem; }
    .chip {
      display: inline-flex; align-items: center; gap: .3rem;
      font-size: .74rem; line-height: 1; padding: .3rem .5rem; border-radius: 999px;
      border: 1px solid var(--line-2); color: var(--muted); background: var(--raised);
      animation: pop .18s var(--ease);
      white-space: nowrap;
    }
    .chip.found   { color: var(--green); border-color: #1d4d39; background: #0e1f18; }
    .chip.splice  { color: var(--amber); border-color: #5a4210; background: #211909; }
    .chip.noise   { color: var(--violet); border-color: #463763; background: #1a1526; }
    .chip.missing { color: var(--red); border-color: #5a1f1f; background: #220f0f; }
    .chip .mark { opacity: .7; font-size: .7rem; }
    .chip.more { color: var(--dim); border-style: dashed; }
    .chip .vo { font-size: .6rem; color: var(--violet); margin-left: .25rem; }
    .chip.sel { outline: 2px solid var(--yellow); outline-offset: 1px; }
    .pop .ph .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }

    .bar {
      display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap;
      border-top: 1px solid var(--line); padding-top: .75rem;
    }
    .bar .left { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .ghost {
      display: inline-flex; align-items: center; gap: .4rem; cursor: pointer;
      background: transparent; border: 1px solid var(--line-2); border-radius: 999px;
      padding: .38rem .8rem; font-size: .78rem; color: var(--muted);
      transition: color .15s, border-color .15s, background .15s;
    }
    .ghost:hover { color: var(--text); border-color: #4a4a52; }
    .ghost[aria-expanded="true"] { color: #000; background: var(--yellow); border-color: var(--yellow); }
    .ghost .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); display: none; }
    .ghost.changed .dot { display: inline-block; }
    .ghost[aria-expanded="true"] .dot { background: #000; }


    .meter { color: var(--dim); font-size: .72rem; padding-left: .25rem; }
    .meter b { color: var(--muted); font-weight: 500; }
    .meter.warn, .meter.warn b { color: var(--amber); }

    .go {
      display: inline-flex; align-items: center; cursor: pointer;
      background: var(--yellow); color: #000; border: none; border-radius: 999px;
      font-family: Impact, 'Arial Black', sans-serif; font-size: 1.1rem; letter-spacing: 1.5px;
      padding: .6rem 1.4rem .55rem;
      box-shadow: 0 6px 20px rgba(255, 229, 0, .18);
      transition: transform .12s var(--ease), background .15s, box-shadow .15s, opacity .15s;
    }
    .go:hover { background: var(--yellow-2); box-shadow: 0 8px 26px rgba(255, 229, 0, .28); }
    .go:active { transform: scale(.97); }
    .go:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; transform: none; }

    /* ── Tweaks ── */
    .tweaks {
      display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s var(--ease);
    }
    .tweaks.open { grid-template-rows: 1fr; }
    .tweaks > .inner { overflow: hidden; min-height: 0; }
    .tweaks .body { padding: 1rem .35rem .25rem; display: flex; flex-direction: column; gap: 1rem; }
    .presets { display: flex; flex-wrap: wrap; gap: .35rem; }
    .presets button {
      cursor: pointer; background: var(--raised); border: 1px solid var(--line-2); border-radius: 999px;
      padding: .32rem .75rem; font-size: .75rem; color: var(--muted); transition: all .15s;
    }
    .presets button:hover { color: var(--text); border-color: #4a4a52; }
    .presets button.on { color: #000; background: var(--yellow); border-color: var(--yellow); }
    .sliders { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: .9rem 1.4rem; }
    .slider { display: grid; grid-template-columns: 1fr auto; gap: .35rem .5rem; align-items: center; }
    .slider .name { color: var(--muted); font-size: .75rem; }
    .slider output { color: var(--text); font-size: .75rem; font-variant-numeric: tabular-nums; }
    .slider input { grid-column: 1 / -1; }
    .toggles { display: flex; flex-wrap: wrap; gap: .6rem 1.4rem; }
    .sing-panel { border-top: 1px dashed var(--line); padding-top: .9rem; display: flex; flex-direction: column; gap: .9rem; }
    .sing-midi { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .8rem; color: var(--muted); font-size: .75rem; }
    .chip.sung { cursor: ns-resize; user-select: none; }
    .chip .note { color: var(--yellow); font-size: .68rem; }
    .voice-settings {
      display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem;
      border-top: 1px dashed var(--line); padding-top: .9rem; color: var(--dim); font-size: .72rem;
    }
    .voice-settings label { display: inline-flex; align-items: center; gap: .45rem; color: var(--muted); font-size: .75rem; }
    #units-input {
      width: 3.6rem; background: var(--raised); border: 1px solid var(--line-2); border-radius: 8px;
      padding: .35rem .4rem; text-align: center; font-size: .8rem; -moz-appearance: textfield;
    }
    #units-input::-webkit-inner-spin-button, #units-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .linkish { background: none; border: none; padding: 0; color: var(--dim); cursor: pointer; font-size: .72rem; text-decoration: underline dotted; }
    .linkish:hover { color: var(--yellow); }
    .voice-settings .linkish { margin-left: auto; }

    .helpers { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .6rem; padding: .8rem .35rem 0; color: var(--dim); font-size: .72rem; }
    .helpers button {
      cursor: pointer; background: none; border: 1px solid var(--line); border-radius: 6px;
      padding: .12rem .45rem; font-size: .72rem; color: var(--muted); transition: all .15s;
    }
    .helpers button:hover { color: var(--yellow); border-color: var(--yellow); }
    .helpers button.linkish { border: none; text-decoration: underline dotted; }
    .helpers button b { color: var(--dim); font-weight: 400; }

    /* ── Suggestions ── */
    #suggest-box {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
      background: #18181b; border: 1px solid var(--line-2); border-radius: 10px;
      box-shadow: 0 16px 40px rgba(0,0,0,.55); max-height: 250px; overflow-y: auto;
      opacity: 0; transform: translateY(-4px); pointer-events: none; transition: opacity .12s, transform .12s var(--ease);
    }
    #suggest-box.open { opacity: 1; transform: none; pointer-events: auto; }
    .suggest-item { display: flex; justify-content: space-between; gap: 1rem; padding: .45rem .8rem; cursor: pointer; font-size: .9rem; }
    .suggest-item:hover, .suggest-item.active { background: #24242a; }
    .suggest-item .s-meta { font-size: .68rem; border-radius: 999px; padding: .1rem .5rem; align-self: center; }
    .suggest-item.phrase .s-meta { color: var(--blue); background: #0b2230; }
    .suggest-item.vocab .s-meta { color: var(--green); background: #0e1f18; }

    /* ── Progress ── */
    .progress { margin-top: .9rem; }
    .progress .track { height: 3px; background: var(--line); border-radius: 999px; overflow: hidden; }
    #progress-bar { height: 100%; width: 0; background: var(--yellow); border-radius: 999px; transition: width .35s var(--ease); }
    .progress.indeterminate #progress-bar { width: 30%; animation: slide 1.3s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
    #status { margin-top: .5rem; font-size: .76rem; color: var(--muted); min-height: 1.1em; }
    #status.error { color: var(--red); }

    /* ── Result ── */
    .result { padding: .75rem; overflow: hidden; animation: rise .35s var(--ease); }
    @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
    .result video { display: block; width: 100%; border-radius: 8px; background: #000; aspect-ratio: 16 / 9; }
    .words { display: flex; flex-wrap: wrap; gap: .3rem; padding: .8rem .15rem .2rem; }
    .word {
      position: relative; display: inline-flex; align-items: center; gap: .25rem;
      font-size: .8rem; padding: .28rem .55rem; border-radius: 7px; cursor: pointer;
      border: 1px solid var(--line-2); background: var(--raised); color: var(--muted);
      transition: transform .12s var(--ease), background .15s, color .15s, border-color .15s, box-shadow .15s;
    }
    .word:hover { transform: translateY(-1px); }
    .word.found   { color: var(--green); border-color: #1d4d39; }
    .word.run     { color: var(--blue); border-color: #164560; }
    .word.spliced { color: var(--amber); border-color: #5a4210; }
    .word.spliced.approx { border-style: dashed; }
    .word.missing { color: var(--red); border-color: #5a1f1f; cursor: default; }
    .word.now { background: var(--yellow); color: #000; border-color: var(--yellow); box-shadow: 0 0 0 3px rgba(255,229,0,.15); }
    /* Floated above the word rather than inline: widening a word on hover
       reflowed every line after it, and a clicked word stayed wide. */
    .word .acts {
      position: absolute; bottom: calc(100% - 3px); left: 50%; transform: translateX(-50%); z-index: 5;
      display: inline-flex; gap: .15rem; padding: .2rem .35rem; border-radius: 7px;
      background: var(--surface); border: 1px solid var(--line-2); box-shadow: 0 6px 18px rgba(0,0,0,.45);
      opacity: 0; pointer-events: none; transition: opacity .12s;
    }
    .word:hover .acts, .word:focus-visible .acts, .word .acts:focus-within { opacity: 1; pointer-events: auto; }
    .word .acts > * {
      background: none; border: none; cursor: pointer; font-size: .72rem; line-height: 1; padding: 0 .12rem;
      color: inherit; text-decoration: none; opacity: .65;
    }
    .word .acts > *:hover { opacity: 1; }
    .word .acts .on { opacity: 1; }
    .word.voted-down { opacity: .55; }
    .chip { cursor: pointer; }
    .chip .fx { color: var(--violet); font-size: .66rem; }
    .pop {
      position: absolute; z-index: 60; width: 34rem; max-width: calc(100vw - 2rem);
      background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0,0,0,.55); padding: .7rem .8rem; display: flex; flex-direction: column; gap: .5rem;
    }
    .pop .ph { color: var(--text); font-size: .8rem; display: flex; justify-content: space-between; gap: .5rem; }
    .pop .row { display: grid; grid-template-columns: 5.2rem 1fr; align-items: center; gap: .5rem; }
    .pop { gap: .85rem; padding: .9rem 1rem; }
    .pop .sliders { grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
    .pop .row > span { color: var(--dim); font-size: .7rem; }
    .pop .seg { display: flex; flex-wrap: wrap; gap: .25rem; }
    .pop .seg button { padding: .22rem .5rem; font-size: .7rem; border-radius: 999px; color: var(--muted); }
    .pop .seg button.on { background: var(--yellow); border-color: var(--yellow); color: #000; }
    .pop .kinds { display: flex; flex-direction: column; gap: .3rem; }
    .pop .glitches { display: flex; flex-wrap: wrap; gap: .3rem; }
    .pop .glitches button { padding: .2rem .5rem; font-size: .72rem; border-radius: 999px; }
    .pop .glitches button.on { border-color: var(--yellow); color: var(--yellow); }
    .pop .clips { display: flex; flex-direction: column; gap: .25rem; max-height: 13rem; overflow-y: auto; }
    .pop .clip { display: grid; grid-template-columns: 1.6rem 1fr auto; gap: .5rem; align-items: center; padding: .3rem .45rem; border-radius: 7px; text-align: left; white-space: normal; justify-content: stretch; }
    .pop .clip.on { border-color: var(--yellow); }
    .pop .clip .src { color: var(--text); font-size: .72rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pop .clip .meta { color: var(--dim); font-size: .66rem; white-space: nowrap; }
    .pop .clip .play { width: 1.6rem; height: 1.6rem; padding: 0; border-radius: 50%; }
    .pop .kinds button { justify-content: flex-start; font-size: .75rem; }
    @media (hover: none) { .word:focus .acts { opacity: 1; pointer-events: auto; } }
    .result-bar { display: flex; align-items: center; justify-content: space-between; gap: .6rem; flex-wrap: wrap; padding: .6rem .15rem .1rem; }
    #summary { color: var(--dim); font-size: .74rem; }
    .result-bar .acts2 { display: flex; gap: .4rem; }
    .legend { display: flex; flex-wrap: wrap; gap: .8rem; padding: .3rem .15rem 0; color: var(--dim); font-size: .68rem; }
    .legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: .3rem; vertical-align: middle; }

    /* ── History ── */
    .history h3 { font-size: .7rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); font-weight: 500; margin: .5rem .25rem .5rem; }
    #history-list { display: flex; flex-direction: column; gap: .3rem; }
    .past {
      display: flex; align-items: center; gap: .75rem; width: 100%; text-align: left; cursor: pointer;
      background: transparent; border: 1px solid transparent; border-radius: 10px; padding: .55rem .7rem;
      color: var(--muted); transition: background .15s, border-color .15s, color .15s;
    }
    .past:hover { background: var(--surface); border-color: var(--line); color: var(--text); }
    .past.current { border-color: var(--line-2); color: var(--text); }
    .past .play { color: var(--yellow); font-size: .8rem; }
    .past .said { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .82rem; }
    .past .when { color: var(--dim); font-size: .7rem; white-space: nowrap; }

    footer { text-align: center; color: #3c3c43; font-size: .7rem; padding: 0 1rem 2rem; line-height: 1.9; }
    footer b { color: var(--dim); font-weight: 500; }

    @media (max-width: 640px) {
      .bar { flex-direction: column-reverse; align-items: stretch; }
      .go { justify-content: center; padding: .8rem; }
      .go kbd { display: none; }
    }
  </style>
</head>
<body>

<header class="top">
  <a class="brand" href="/">YTP<span>MACHINE</span></a>
  <nav aria-label="Pages">
    <a class="on" href="/">say</a>
    <a href="/ytpmv.html">ytpmv</a>
    <a href="/splice.html">splice</a>
    <a href="/editor.html">corpus</a>
  </nav>
  <div class="spacer"></div>
  <label class="pill-select" id="corpus-wrap" hidden>voice <select id="corpus-select"></select></label>
</header>

<main>
  <section class="card composer">
    <form id="form" autocomplete="off">
      <div id="input-wrap">
        <textarea id="text-input" rows="2" spellcheck="false" aria-label="What should be said"
                  placeholder="type something for the voice to say…"></textarea>
        <div id="text-view" tabindex="0" role="button" hidden
             title="click to edit; words with effects are marked, hover one to see them"></div>
        <div id="suggest-box" role="listbox"></div>
      </div>
      <div id="chips" class="chips" aria-live="polite"></div>

      <div class="bar">
        <div class="left">
          <button type="button" class="ghost" id="tweak-btn" aria-expanded="false" aria-controls="tweaks">
            <span aria-hidden="true">⚙</span> tweak <span class="dot" title="changed from the defaults"></span>
          </button>
          <label class="switch" title="Burn each word onto the picture as it is said">
            <input type="checkbox" id="subtitles" checked><span class="track"></span> captions
          </label>
          <span id="input-meter" class="meter"></span>
        </div>
        <button type="submit" id="submit-btn" class="go">SAY IT<kbd>Ctrl ↵</kbd></button>
      </div>

      <div class="tweaks" id="tweaks">
        <div class="inner">
          <div class="body">
            <div class="presets" id="presets" role="group" aria-label="Presets"></div>
            <div class="sliders" id="sliders"></div>
            <div class="toggles" id="toggles"></div>
            <div class="sing-panel" id="sing-panel" hidden>
              <div class="section-label" style="margin:0">the tune</div>
              <div class="sliders" id="sing-sliders"></div>
              <div class="sing-midi">
                <label title="Sing to the top line of a MIDI file instead of a tune shape, one note a word">tune from a MIDI
                  <input type="file" id="sing-file" accept=".mid,.midi,audio/midi"></label>
                <select id="sing-part" hidden title="Which part of the file is the tune"></select>
                <span id="sing-midi-name" class="hint"></span>
                <button type="button" class="linkish" id="sing-midi-clear" hidden>use the tune shape</button>
              </div>
              <div class="hint"><b>Click a word chip</b> to move that word up or down from the tune.</div>
            </div>
            <div class="voice-settings" id="splice-wrap" hidden>
              <span>for this voice</span>
              <label title="How hard to try for a word the voice never said">effort
                <select id="splice-select">
                  <option value="strict">strict — real clips only</option>
                  <option value="loose">loose — near-enough sounds</option>
                  <option value="desperate">desperate — say it regardless</option>
                </select>
              </label>
              <label title="How many pieces a word may be built from. Every piece is a join, and a join is where a splice sounds like one.">pieces
                <input id="units-input" type="number" min="2" max="24" step="1">
              </label>
              <button type="button" class="linkish" id="tweak-reset">reset tweaks</button>
            </div>
          </div>
        </div>
      </div>

      <div class="helpers">
        <span><button type="button" data-insert="~word~">~backwards~</button></span>
        <span><button type="button" data-insert="sooooo">loooong</button> holds a letter</span>
        <span id="noise-box" hidden>· noises: <span id="noise-list"></span></span>
      </div>
    </form>

    <div class="progress" id="progress" hidden>
      <div class="track"><div id="progress-bar"></div></div>
    </div>
    <div id="status" role="status"></div>
  </section>

  <section class="card result" id="result" hidden>
    <video id="output-video" controls playsinline></video>
    <div class="words" id="word-results"></div>
    <div class="legend">
      <span><i style="background:var(--blue)"></i>real phrase</span>
      <span><i style="background:var(--green)"></i>clip</span>
      <span><i style="background:var(--amber)"></i>spliced</span>
      <span><i style="background:var(--red)"></i>missing</span>
      <span>click a word to jump to it</span>
    </div>
    <div class="result-bar">
      <span id="summary"></span>
      <div class="acts2">
        <button type="button" class="btn" id="same-btn" title="This exact video again, same takes and same chaos, with the settings as they are now" hidden>⟲ same</button>
        <button type="button" class="btn" id="again-btn" title="Same words, picked again">↻ again</button>
        <a class="btn primary" id="download-link" download>⤓ download</a>
      </div>
    </div>
  </section>

  <section class="history" id="history" hidden>
    <h3>recent</h3>
    <div id="history-list"></div>
  </section>
</main>

<footer>
  <span id="stats"></span>
</footer>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const textInput = $('text-input'), submitBtn = $('submit-btn'), statusEl = $('status');
  const store = {
    get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Every response through here, so a proxy's HTML error page is reported as
  // what it is rather than as a JSON parse error.
  async function fetchJson(url, opts) {
    let r;
    try { r = await fetch(url, opts); } catch (e) { return { error: `could not reach the server (${e.message})` }; }
    const raw = await r.text();
    try { return { ok: r.ok, status: r.status, data: JSON.parse(raw) }; }
    catch { return { error: `the server replied ${r.status} with something that isn't JSON` + (raw.trim() ? ` — ${raw.trim().slice(0, 120)}` : '') }; }
  }
  const postJson = (url, body) => fetchJson(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

  // ── Settings ──────────────────────────────────────────────────────────────
  // What app/generate.py's OPTIONS accepts. Kept in this browser, sent with
  // every sentence.
  const SLIDERS = [
    { key: 'speed', name: 'speed', min: 0.5, max: 2, step: 0.05, def: 1, fmt: v => `${v.toFixed(2)}×`,
      hint: 'The whole video faster or slower. The voice keeps its pitch.' },
    { key: 'pitch', name: 'pitch', min: -12, max: 12, step: 1, def: 0, fmt: v => v === 0 ? 'as recorded' : `${v > 0 ? '+' : ''}${v} semitones`,
      hint: 'Higher or lower, at the same speed.' },
    { key: 'word_gap', name: 'gap between words', min: 0, max: 0.6, step: 0.01, def: 0.03, fmt: v => `${Math.round(v * 1000)} ms`,
      hint: 'A held frame and a moment of silence between separate words.' },
    { key: 'sentence_pause', name: 'pause at a full stop', min: 0, max: 2, step: 0.05, def: 0.5, fmt: v => `${v.toFixed(2)} s`,
      hint: 'How long a . ! or ? waits before the next sentence.' },
    { key: 'chaos', name: 'chaos', min: 0, max: 1, step: 0.05, def: 0,
      fmt: v => v ? `${Math.round(v * 100)}% of words` : 'none',
      hint: 'How many words get wrecked at random: shaking, colours, earrape, stutters, boomerangs. The YTP knob.' },
    { key: 'pause_style', name: 'at a full stop', min: 0, max: 2, step: 1, def: 0,
      fmt: v => ['cut to them saying nothing', 'freeze on the last frame', 'no pause at all'][v],
      hint: 'What happens for the length of the full-stop pause: footage of the speaker being quiet, the last frame held still, or straight on to the next sentence.' },
    { key: 'stretch', name: 'held letter', min: 0.02, max: 0.35, step: 0.01, def: 0.09, fmt: v => `${Math.round(v * 1000)} ms a letter`,
      hint: 'Type a letter several times — loooong — and it is held this much longer for every extra one.' },
    { key: 'sing_amount', name: 'tune strength', min: 0, max: 1, step: 0.05, def: 1, sing: true,
      fmt: v => v >= 1 ? 'robot' : v <= 0 ? 'as spoken' : `${Math.round(v * 100)}%`,
      hint: 'How hard each word is pulled onto its note. Full is the autotune sound; less keeps some of the speech in it.' },
    { key: 'sing_vibrato', name: 'vibrato', min: 0, max: 1, step: 0.05, def: 0, sing: true,
      fmt: v => v ? `${v.toFixed(2)} semitones` : 'none', hint: 'A wobble on held notes, growing in as a singer does.' },
    { key: 'sing_cute', name: 'cute', min: 0, max: 1, step: 0.05, def: 0, sing: true,
      fmt: v => v ? `${Math.round(v * 100)}%` : 'as recorded', hint: 'Higher, and a smaller throat: the Miku knob.' },
    { key: 'sing_key', name: 'key', min: 0, max: 11, step: 1, def: 0, sing: true,
      fmt: v => ['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'][v],
      hint: 'With sing on, the key the tune is in.' },
    { key: 'sing_shape', name: 'tune', min: 0, max: 4, step: 1, def: 0, sing: true,
      fmt: v => ['up and down', 'rising', 'falling', 'wandering', 'twinkle twinkle'][v],
      hint: 'With sing on, the shape of the tune: one note a word.' },
  ];
  const TOGGLES = [
    { key: 'clean_takes', name: 'clean takes', def: true,
      hint: 'Prefer recordings of a word said before a pause. Far fewer clipped endings and bits of the next word, at the cost of some variety.' },
    { key: 'phrases', name: 'real phrases', def: true,
      hint: 'When several words were said together somewhere, play that recording instead of cutting word by word. Off is choppier.' },
    { key: 'sing', name: 'sing', def: false,
      hint: 'Every word tuned onto a note of a tune, autotune style. Held letters make longer notes.' },
    { key: 'vocode', name: 'vocoder', def: false,
      hint: 'Every word played by a synth chord that speaks it, robot-choir style. It plays the same tune singing would: the key, the tune shape, a MIDI melody, or a note set on a word.' },
  ];
  // Singing and the vocoder both put words on a tune, and share its controls.
  const tuned = () => opts.sing || opts.vocode;
  const DEFAULTS = Object.fromEntries([...SLIDERS, ...TOGGLES].map(o => [o.key, o.def]));
  Object.assign(DEFAULTS, { sing_midi: '', sing_part: '' });
  const PRESETS = [
    { name: 'natural', opts: {} },
    { name: 'choppy', opts: { phrases: false, clean_takes: false, word_gap: 0.12, sentence_pause: 0.3 } },
    { name: 'rapid fire', opts: { speed: 1.35, word_gap: 0, sentence_pause: 0.15 } },
    { name: 'chipmunk', opts: { pitch: 7, speed: 1.2 } },
    { name: 'slow and low', opts: { pitch: -5, speed: 0.75, sentence_pause: 0.9 } },
    { name: 'drawn out', opts: { stretch: 0.2, word_gap: 0.08, speed: 0.9 } },
    { name: 'chickenpika', opts: { chaos: 0.55, speed: 1.3, word_gap: 0, sentence_pause: 0.15, phrases: false } },
    { name: 'sing', opts: { sing: true, stretch: 0.15, word_gap: 0.06 } },
    { name: 'miku', opts: { sing: true, sing_cute: 0.8, sing_vibrato: 0.3, stretch: 0.18, word_gap: 0.05, sing_shape: 3 } },
  ];
  let opts = Object.assign({}, DEFAULTS, store.get('ytp-opts', {}));

  function drawSettings() {
    const slider = o => `
      <label class="slider" title="${esc(o.hint)}">
        <span class="name">${esc(o.name)}</span><output data-out="${o.key}"></output>
        <input type="range" data-opt="${o.key}" min="${o.min}" max="${o.max}" step="${o.step}">
      </label>`;
    $('sliders').innerHTML = SLIDERS.filter(o => !o.sing).map(slider).join('');
    $('sing-sliders').innerHTML = SLIDERS.filter(o => o.sing).map(slider).join('');
    $('toggles').innerHTML = TOGGLES.map(o => `
      <label class="switch" title="${esc(o.hint)}">
        <input type="checkbox" data-opt="${o.key}"><span class="track"></span> ${esc(o.name)}
      </label>`).join('');
    $('presets').innerHTML = PRESETS.map((p, i) => `<button type="button" data-preset="${i}">${esc(p.name)}</button>`).join('');
    syncSettings();
  }
  function syncSettings() {
    for (const o of SLIDERS) {
      const el = document.querySelector(`input[data-opt="${o.key}"]`);
      el.value = opts[o.key];
      el.style.setProperty('--p', `${(opts[o.key] - o.min) / (o.max - o.min) * 100}%`);
      document.querySelector(`output[data-out="${o.key}"]`).textContent = o.fmt(Number(opts[o.key]));
    }
    for (const o of TOGGLES) document.querySelector(`input[data-opt="${o.key}"]`).checked = !!opts[o.key];
    const same = (p) => Object.keys(DEFAULTS).every(k => (k in p.opts ? p.opts[k] : DEFAULTS[k]) === opts[k]);
    document.querySelectorAll('#presets button').forEach(b => b.classList.toggle('on', same(PRESETS[b.dataset.preset])));
    $('tweak-btn').classList.toggle('changed', !same(PRESETS[0]));
    $('sing-panel').hidden = !tuned();
    drawSingMidi();
    store.set('ytp-opts', opts);
  }
  for (const box of ['sliders', 'sing-sliders']) $(box).addEventListener('input', (e) => {
    const k = e.target.dataset.opt; if (!k) return;
    opts[k] = Number(e.target.value); syncSettings();
  });
  // The tune from a MIDI file: uploaded to the YTPMV, which keeps it and says
  // what parts it has. Only its id and the part chosen are kept here.
  let singParts = store.get('ytp-sing-parts', null);
  function drawSingMidi() {
    const on = !!opts.sing_midi;
    $('sing-midi-clear').hidden = !on;
    $('sing-part').hidden = !on || !singParts;
    $('sing-midi-name').textContent = on ? (singParts?.name || 'a MIDI file') : '';
    if (on && singParts) {
      $('sing-part').innerHTML = `<option value="">the lead</option>` + singParts.parts
        .map(p => `<option value="${esc(p.id)}">${esc(p.name)} (${esc(p.role)})</option>`).join('');
      $('sing-part').value = opts.sing_part || '';
    }
  }
  $('sing-file').addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    $('sing-midi-name').textContent = 'reading it…';
    const fd = new FormData(); fd.append('midi', f);
    const res = await fetchJson('/api/ytpmv/midi', { method: 'POST', body: fd });
    e.target.value = '';
    if (!res.ok) { $('sing-midi-name').textContent = res.error || res.data?.detail || 'that file would not read'; return; }
    singParts = { name: f.name, parts: (res.data.parts || []).filter(p => !String(p.role).startsWith('drums')) };
    store.set('ytp-sing-parts', singParts);
    opts.sing_midi = res.data.midi_id; opts.sing_part = ''; syncSettings();
  });
  $('sing-part').addEventListener('change', (e) => { opts.sing_part = e.target.value; syncSettings(); });
  $('sing-midi-clear').addEventListener('click', () => { opts.sing_midi = ''; opts.sing_part = ''; syncSettings(); });
  $('toggles').addEventListener('change', (e) => {
    const k = e.target.dataset.opt; if (!k) return;
    opts[k] = e.target.checked; syncSettings();
    if (k === 'sing') drawChips();
  });
  $('presets').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-preset]'); if (!b) return;
    opts = Object.assign({}, DEFAULTS, PRESETS[b.dataset.preset].opts); syncSettings();
  });
  $('tweak-reset').addEventListener('click', () => { opts = Object.assign({}, DEFAULTS); syncSettings(); });
  drawSettings();

  const tweaks = $('tweaks'), tweakBtn = $('tweak-btn');
  function openTweaks(on) {
    tweaks.classList.toggle('open', on);
    tweakBtn.setAttribute('aria-expanded', String(on));
    store.set('ytp-tweaks-open', on);
  }
  tweakBtn.addEventListener('click', () => openTweaks(!tweaks.classList.contains('open')));
  openTweaks(store.get('ytp-tweaks-open', false));
  $('subtitles').checked = store.get('ytp-captions', true);
  $('subtitles').addEventListener('change', () => store.set('ytp-captions', $('subtitles').checked));

  // ── The voice, and its own settings ──────────────────────────────────────
  async function loadStats() {
    const r = await fetchJson('/api/stats');
    if (!r.ok) return;
    const d = r.data;
    $('stats').innerHTML = `<b>${d.total_clips.toLocaleString()}</b> clips · <b>${d.unique_words.toLocaleString()}</b> words · <b>${d.sources.toLocaleString()}</b> videos`;
  }
  // Every corpus, for giving words another voice. The first is the active one.
  let voices = [];
  const voiceName = (slug) => (voices.find(c => c.slug === slug) || { name: slug }).name;
  async function loadCorpora() {
    const r = await fetchJson('/api/corpora');
    if (!r.ok || !r.data.corpora) return;
    voices = r.data.corpora.filter(c => !c.error).sort((a, b) => b.active - a.active);
    drawView();                       // the folded text names voices by name, not slug
    if (r.data.corpora.length < 2) return;
    $('corpus-select').innerHTML = r.data.corpora.map(c =>
      `<option value="${esc(c.slug)}"${c.active ? ' selected' : ''}${c.error ? ' disabled' : ''}>${esc(c.name)}${c.error ? ' (unreadable)' : ''}</option>`).join('');
    $('corpus-wrap').hidden = false;
  }
  async function loadSpliceMode() {
    const r = await fetchJson('/api/splice-mode');
    if (!r.ok) return;
    if (r.data.mode) $('splice-select').value = r.data.mode;
    $('splice-wrap').hidden = false;
  }
  async function loadMaxUnits() {
    const r = await fetchJson('/api/max-units');
    if (!r.ok) return;
    const u = $('units-input');
    u.min = r.data.min; u.max = r.data.max; u.value = r.data.units;
    u.title = `${r.data.min}-${r.data.max}, normally ${r.data.default}`;
  }
  $('splice-select').addEventListener('change', async () => {
    const el = $('splice-select'); el.disabled = true;
    const r = await postJson('/api/splice-mode', { mode: el.value });
    if (!r.ok) await loadSpliceMode();
    el.disabled = false;
  });
  $('units-input').addEventListener('change', async () => {
    const el = $('units-input'), units = parseInt(el.value, 10);
    if (!Number.isFinite(units)) return loadMaxUnits();
    el.disabled = true;
    const r = await postJson('/api/max-units', { units });
    if (!r.ok) await loadMaxUnits();
    el.disabled = false;
  });
  // Switching the voice switches it for everyone, the bot included; the
  // vocabulary and noises belong to it and come with it.
  $('corpus-select').addEventListener('change', async () => {
    const el = $('corpus-select'); el.disabled = true;
    const r = await postJson('/api/corpus', { slug: el.value });
    if (!r.ok) await loadCorpora();
    else { await Promise.all([loadStats(), loadWords(), loadNoises(), loadSpliceMode(), loadMaxUnits()]); }
    el.disabled = false;
  });

  // ── What the voice can say ───────────────────────────────────────────────
  let vocab = null, noises = {};
  async function loadWords() {
    const r = await fetchJson('/api/words');
    if (r.ok) { vocab = r.data.words; drawChips(); }
  }
  async function loadNoises() {
    const r = await fetchJson('/api/noises');
    noises = (r.ok && r.data.noises) || {};
    drawNoises(false);
  }
  // The commonest few, and the rest behind a button: a voice with twenty
  // kinds of noise otherwise buries the box under them.
  function drawNoises(all) {
    const kinds = Object.entries(noises).sort((a, b) => b[1] - a[1]);
    $('noise-box').hidden = !kinds.length;
    const shown = all ? kinds : kinds.slice(0, 5);
    $('noise-list').innerHTML = shown.map(([k, n]) => `<button type="button" data-insert="*${esc(k)}*">*${esc(k)}* <b>${n}</b></button>`).join(' ')
      + (kinds.length > shown.length ? ` <button type="button" class="linkish" data-more-noises>+${kinds.length - shown.length} more</button>` : '');
  }

  // Mirrors the server's tokeniser closely enough to preview it. The video is
  // always tokenised server-side; a drift here is a wrong colour on a chip.
  const UNIT_WORDS = { km: 'kilometers', kmh: 'kilometers per hour', kph: 'kilometers per hour', mph: 'miles per hour',
    kg: 'kilograms', hp: 'horsepower', kw: 'kilowatts', nm: 'newton metres', mm: 'millimeters', cm: 'centimeters', ml: 'millilitres' };
  const UNITS_AFTER_NUM = { l: 'litres', m: 'meters', g: 'grams', k: 'thousand', t: 'tonnes' };
  const DECADES = { 20: 'twenties', 30: 'thirties', 40: 'forties', 50: 'fifties', 60: 'sixties', 70: 'seventies', 80: 'eighties', 90: 'nineties' };
  const ABBREV = { mk: 'mark' };
  const STRIP = /^[.,!?;:'"()\[\]]+|[.,!?;:'"()\[\]]+$/g;

  // "loooong" -> "long": the spelling the corpus has heard most, as the server picks it.
  function unstretch(tok) {
    const m = tok.match(/^([A-Za-z]+)[.,!?;:'"()\]]*$/);
    if (!m) return null;
    const raw = m[1].toLowerCase();
    const known = vocab && raw in vocab;
    if (known) return null;
    const runs = [];
    raw.replace(/([a-z])\1+/g, (s, _c, off) => { runs.push([off, s.length]); return s; });
    const use = runs.filter(([, n]) => n >= 3 || n === 2);
    if (!use.length || use.length > 6) return null;
    let best = null, bestCount = -1;
    for (let mask = 0; mask < (1 << use.length); mask++) {
      let w = '', at = 0;
      use.forEach(([p, n], k) => { w += raw.slice(at, p) + raw[p].repeat((mask >> k) & 1 ? 2 : 1); at = p + n; });
      w += raw.slice(at);
      const c = (vocab && vocab[w]) || 0;
      if (c > bestCount || (c === bestCount && w.length < best.length)) { best = w; bestCount = c; }
    }
    // Only doubled letters: English is full of them ("fully", "ass"), and
    // the page has only the corpus's words, not the dictionary the server
    // also checks. So a double reads as held only when shrinking it gives a
    // word the corpus has heard -- "soo" is "so" -- never a made-up one.
    if (!use.some(([, n]) => n >= 3) && !(vocab && vocab[best] && best.length > 1)) return null;
    return best === raw ? null : best;
  }

  function spokenWords(tok) {
    const raw = tok.replace(/[^\w]/g, '').toLowerCase();
    if (raw && vocab && raw in vocab) return [raw];
    const out = [];
    for (let atom of tok.split(/[/–—-]+/)) {
      atom = atom.replace(/^[$£€]/, '').replace(/%$/, '').replace(STRIP, '').toLowerCase();
      if (!atom) continue;
      if (/^\d+(\.\d+)?$/.test(atom) || /^\d+(st|nd|rd|th)$/.test(atom)) { out.push({ number: atom }); continue; }
      const dec = atom.match(/^(?:19|20)?(\d0)s$/);
      if (dec && DECADES[dec[1]]) { out.push(DECADES[dec[1]]); continue; }
      if (UNIT_WORDS[atom]) { out.push(...UNIT_WORDS[atom].split(' ')); continue; }
      if (ABBREV[atom]) { out.push(ABBREV[atom]); continue; }
      const parts = atom.match(/\d+|[a-z]+/g) || [];
      if (parts.length > 1) {
        let afterNum = false;
        for (const p of parts) {
          if (/^\d+$/.test(p)) { out.push({ number: p }); afterNum = true; continue; }
          out.push(...(UNIT_WORDS[p] || (afterNum && UNITS_AFTER_NUM[p]) || ABBREV[p] || p).split(' '));
          afterNum = false;
        }
        continue;
      }
      const w = atom.replace(/[^\w]/g, '');
      if (w) out.push(w);
    }
    return out;
  }

  // Each typed token as the chips that preview it.
  function preview(text) {
    const chips = [];
    let ti = -1;
    for (let tok of text.split(/\s+/)) {
      if (!tok) continue;
      ti++;
      const { base, note, fx, punct } = splitTok(tok);
      const at = chips.length;
      tokens(base + punct);
      for (const c of chips.slice(at)) Object.assign(c, { ti, note, fx: Object.keys(fx).length ? fx : null });
    }
    return chips;

    function tokens(tok) {
      let rev = false;
      const r = tok.match(/^~(.+?)~([.!?"')\]]*)$/);
      if (r) { rev = true; tok = r[1] + r[2]; }
      const nz = tok.match(/^\*([A-Za-z]+)\*[.!?]*$/);
      if (nz) {
        const k = nz[1].toLowerCase();
        chips.push({ label: `*${k}*`, cls: k in noises ? 'noise' : 'splice', rev, title: k in noises ? 'a noise this voice makes' : 'no such noise — the word is said instead' });
        return;
      }
      const held = unstretch(tok);
      if (held) {
        chips.push({ label: held, cls: vocab && held in vocab ? 'found' : 'splice', rev, held: true, title: `said as "${held}", held` });
        return;
      }
      for (const w of spokenWords(tok)) {
        if (typeof w === 'object') { chips.push({ label: w.number, cls: '', rev, title: 'a number, said in words' }); continue; }
        const found = vocab ? w in vocab : null;
        chips.push({ label: w, cls: found === null ? '' : found ? 'found' : 'splice', rev,
                     title: found === null ? '' : found ? `${vocab[w]} recording${vocab[w] === 1 ? '' : 's'}` : 'no recording — built from sounds' });
      }
    }
  }

  // A word's markup, which the chip menu writes so nobody has to type it:
  // word^+2{pause=0.5,rate=0.8,pitch=2,vol=6,emph=strong,spell}. The same
  // patterns as app/generate.py's MARK and FX.
  const NOTE_MARK = /^(.*?)\^([+-]?\d{1,2}|[A-Ga-g][#b]?-?\d)([.,!?;:"')\]]*)$/;
  const FX_MARK = /^(.*?)\{([\w=.,+\- ]*)\}([.,!?;:"')\]]*)$/;
  function splitTok(tok) {
    let fx = {}, note = null, punct = '';
    const f = tok.match(FX_MARK);
    if (f && f[1]) {
      tok = f[1]; punct = f[3];
      for (const item of f[2].split(',')) {
        const [k, v] = item.split('=');
        if (k) fx[k.trim()] = v === undefined ? true : (['emph', 'v'].includes(k.trim()) ? v.trim() : Number(v));
      }
    }
    const m = tok.match(NOTE_MARK);
    if (m && m[1]) { tok = m[1]; note = m[2]; punct = m[3] + punct; }
    const b = tok.match(/^(.*?)([.,!?;:"')\]]*)$/);
    return { base: b[1], note, fx, punct: b[2] + punct };
  }
  function joinTok({ base, note, fx, punct }) {
    const body = Object.entries(fx).filter(([, v]) => v !== undefined && v !== null && v !== false)
      .map(([k, v]) => v === true ? k : `${k}=${v}`).join(',');
    return `${base}${note ? `^${note}` : ''}${body ? `{${body}}` : ''}${punct}`;
  }
  // One word by its index, or several: a selection is edited in one go, so
  // the chips and the text redraw once rather than once a word.
  function editTok(ti, change) {
    const want = new Set([].concat(ti));
    const parts = textInput.value.split(/(\s+)/);
    let n = -1;
    for (let j = 0; j < parts.length; j++) {
      if (j % 2 || !parts[j] || !want.has(++n)) continue;
      const t = splitTok(parts[j]);
      change(t);
      parts[j] = joinTok(t);
    }
    textInput.value = parts.join('');
    textInput.dispatchEvent(new Event('input'));
  }
  function tokAt(ti) {
    return splitTok(textInput.value.split(/\s+/).filter(Boolean)[ti] || '');
  }

  // One floating menu, for a chip's effects or a result word's report.
  const pop = document.createElement('div');
  pop.className = 'pop'; pop.hidden = true;
  document.body.appendChild(pop);
  function openPop(anchor, html, wire) {
    pop.innerHTML = html; pop.hidden = false;
    const r = anchor.getBoundingClientRect();
    pop.style.left = `${Math.max(8, Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - pop.offsetWidth - 8))}px`;
    pop.style.top = `${window.scrollY + r.bottom + 6}px`;
    wire(pop);
  }
  // composedPath, not contains: a choice redraws the menu, detaching the button that was clicked.
  function closePop() {
    pop.hidden = true;
    if (sel.length) { sel = []; drawChips(); }
  }
  document.addEventListener('click', (e) => { const path = e.composedPath(); if (!pop.hidden && !path.includes(pop) && !path.some(n => n.matches && n.matches('.chip, .word .acts'))) closePop(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePop(); });

  // The words the menu is editing, by token index. Click a word to pick it,
  // shift-click another to take in everything between; "whole sentence"
  // widens it to the full stops either side.
  let sel = [], selAnchor = null;
  const span = (a, b) => Array.from({ length: Math.abs(b - a) + 1 }, (_, k) => Math.min(a, b) + k);
  function sentenceOf(ti) {
    const toks = textInput.value.split(/\s+/).filter(Boolean);
    const stop = (t) => /[.!?]["')\]]*$/.test(splitTok(t).punct);
    let a = ti, b = ti;
    while (a > 0 && !stop(toks[a - 1])) a--;
    while (b < toks.length - 1 && !stop(toks[b])) b++;
    return span(a, b);
  }

  // A word's own settings, laid out like the sentence's: sliders, then
  // switches. A slider at its "as the sentence" end removes the setting.
  // [key, name, min, max, step, neutral, format]
  const FX_SLIDERS = [
    ['pause', 'pause after', -0.05, 3, 0.05, -0.05, v => v < 0 ? 'the usual gap' : `${v.toFixed(2)} s`],
    ['rate', 'speed', 0.5, 2, 0.05, 1, v => `${v.toFixed(2)}×`],
    ['pitch', 'pitch', -12, 12, 1, 0, v => v === 0 ? 'as recorded' : `${v > 0 ? '+' : ''}${v} semitones`],
    ['vol', 'volume', -12, 12, 1, 0, v => v === 0 ? 'as recorded' : `${v > 0 ? '+' : ''}${v} dB`],
  ];
  const NOTE_SLIDER = ['note', 'sung note', -12, 12, 1, 0, v => v === 0 ? 'on the tune' : `${v > 0 ? '+' : ''}${v} from the tune`];
  // The same names as GLITCH in app/generate.py, plus the boomerang.
  const GLITCHES = ['shake', 'punch', 'spin', 'rainbow', 'invert', 'flip', 'strobe', 'crunch',
                    'fringe', 'earrape', 'wobble', 'cave', 'stutter', 'boom', 'vocode'];
  const GLITCH_LABEL = { boom: 'boomerang', vocode: 'vocoder' };
  const EMPH = [['none', null], ['reduced', 'reduced'], ['moderate', 'moderate'], ['strong', 'strong']];
  // Which recording a word uses. Fetched once a word, and played in the menu
  // from the source video itself, from the clip's start to its end.
  const clipCache = {};
  const mmss = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;
  // A word's recordings are its voice's: the same word in another corpus is
  // other clips entirely, with ids that mean something else here.
  const clipKey = (ti) => {
    const t = tokAt(ti);
    return [t.fx.v || '', t.base.replace(/[~*]/g, '').replace(/[^\w']/g, '').toLowerCase()];
  };
  async function drawClips(el, ti) {
    const [voice, word] = clipKey(ti), key = `${voice}:${word}`;
    const box = el.querySelector('.clips'); if (!box || !word) return;
    const got = clipCache[key] || (clipCache[key] = await fetchJson(`/api/clips/${encodeURIComponent(word)}?voice=${encodeURIComponent(voice)}`));
    if (!got.ok || !got.data.clips.length) {
      box.innerHTML = `<div class="hint">${got.ok ? 'No recording of this word — it is built from pieces of others.' : esc(got.error || 'could not load the clips')}</div>`;
      return;
    }
    const cur = tokAt(ti).fx.clip;
    box.innerHTML = `<button type="button" class="clip${cur ? '' : ' on'}" data-clip=""><span></span><span class="src">let it choose</span><span class="meta">${got.data.clips.length} recordings</span></button>` +
      got.data.clips.map(c => `<button type="button" class="clip${cur === c.id ? ' on' : ''}" data-clip="${c.id}">
        <span class="play" data-play="${c.id}" title="hear it">▶</span>
        <span class="src" title="${esc(c.source)}">${esc(c.source)}</span>
        <span class="meta">at ${mmss(c.start)} · ${Math.round((c.end - c.start) * 1000)} ms${c.clean ? ' · clean' : ''}${c.score ? ` · ${c.score > 0 ? '▲' : '▼'}${Math.abs(c.score)}` : ''}${c.reports ? ` · ✂${c.reports}` : ''}${c.vetoed ? ' · turned down' : ''}</span>
      </button>`).join('');
    box.dataset.corpus = got.data.corpus;
  }
  function playClip(el, c, corpus) {
    // Audio only: the picture appearing pushed the list down under the pointer.
    const v = el.querySelector('audio');
    const src = `/api/edit/source/${c.source_id}/video?c=${encodeURIComponent(corpus)}`;
    const go = () => { v.currentTime = c.start; v.play().catch(() => {}); };
    v.ontimeupdate = () => { if (v.currentTime >= c.end + 0.03) v.pause(); };
    if (v.dataset.src !== src) { v.dataset.src = src; v.src = src; v.onloadedmetadata = go; } else go();
  }

  function drawFxPop(chip) {
    const ti = Number(chip.dataset.ti), t = tokAt(ti);
    const tis = sel.length ? sel : [ti], many = tis.length > 1;
    const title = many ? `${tis.length} words: ${tis.map(k => tokAt(k).base.replace(/[~*]/g, '')).join(' ')}` : t.base.replace(/[~*]/g, '');
    const named = /^[A-Ga-g]/.test(t.note || '');
    const rows = [...FX_SLIDERS, ...(tuned() && !named ? [NOTE_SLIDER] : [])];
    const valueOf = ([key, , , , , neutral]) => key === 'note' ? Number(t.note || 0) : (t.fx[key] ?? neutral);
    const rev = /^~.+~$/.test(t.base);
    openPop(chip, `<div class="ph"><b class="title" title="${esc(title)}">${esc(title)}</b>
        <button type="button" class="linkish" data-sentence>whole sentence</button>
        <button type="button" class="linkish" data-clear>reset ${many ? 'these' : 'this word'}</button></div>
      ${many ? '' : '<div class="hint" style="margin:-.2rem 0 .1rem">shift-click another word to edit a run of them together</div>'}
      <div class="sliders">${rows.map(r => `
        <label class="slider"><span class="name">${r[1]}</span><output data-out="${r[0]}">${r[6](valueOf(r))}</output>
          <input type="range" data-fx="${r[0]}" min="${r[2]}" max="${r[3]}" step="${r[4]}" value="${valueOf(r)}"></label>`).join('')}</div>
      ${voices.length > 1 ? `<div class="row"><span>voice</span><select data-voice>${voices.map((c, k) =>
        `<option value="${k ? esc(c.slug) : ''}"${(t.fx.v || '') === (k ? c.slug : '') ? ' selected' : ''}>${esc(c.name)}${k ? '' : ' (this one)'}</option>`).join('')}</select></div>` : ''}
      <div class="row"><span>emphasis</span><div class="seg">${EMPH.map(([label, v]) =>
        `<button type="button" data-emph="${v ?? ''}" class="${(t.fx.emph ?? null) === v ? 'on' : ''}">${label}</button>`).join('')}</div></div>
      <div class="toggles">
        <label class="switch"><input type="checkbox" data-flag="spell" ${t.fx.spell ? 'checked' : ''}><span class="track"></span> spell it out</label>
        <label class="switch"><input type="checkbox" data-flag="reverse" ${rev ? 'checked' : ''}><span class="track"></span> backwards</label>
      </div>
      <div><div class="section-label" style="margin:.1rem 0 .4rem">glitch</div>
        <div class="glitches">${GLITCHES.map(g =>
          `<button type="button" data-glitch="${g}" class="${t.fx[g] ? 'on' : ''}">${GLITCH_LABEL[g] || g}</button>`).join('')}</div></div>
      ${many ? '' : `<div><div class="section-label" style="margin:.1rem 0 .4rem">recording</div>
        <audio hidden></audio>
        <div class="clips"><div class="hint">loading the recordings…</div></div></div>`}`,
      (el) => {
        // Sliders change the text as they move, without redrawing the menu
        // under the pointer mid-drag.
        el.oninput = (e) => {
          const key = e.target.dataset.fx; if (!key) return;
          const r = rows.find(x => x[0] === key), v = Number(e.target.value);
          el.querySelector(`output[data-out="${key}"]`).textContent = r[6](v);
          editTok(tis, (tok) => {
            if (key === 'note') tok.note = v ? `${v > 0 ? '+' : ''}${v}` : null;
            else tok.fx[key] = v === r[5] ? undefined : v;
          });
        };
        el.onchange = (e) => {
          if (e.target.dataset.voice !== undefined) {
            editTok(tis, (tok) => { tok.fx.v = e.target.value || undefined; tok.fx.clip = undefined; });
            drawFxPop($('chips').querySelector(`.chip[data-ti="${ti}"]`) || chip);
            return;
          }
          const flag = e.target.dataset.flag; if (!flag) return;
          editTok(tis, (tok) => {
            if (flag === 'spell') tok.fx.spell = e.target.checked || undefined;
            else tok.base = e.target.checked ? `~${tok.base.replace(/^~|~$/g, '')}~` : tok.base.replace(/^~(.+)~$/, '$1');
          });
        };
        el.onclick = (e) => {
          const play = e.target.closest('[data-play]');
          if (play) {
            const got = clipCache[clipKey(ti).join(':')];
            const c = got.data.clips.find(x => x.id === Number(play.dataset.play));
            playClip(el, c, got.data.corpus);
            return;
          }
          const pick = e.target.closest('button[data-clip]');
          if (pick) {
            editTok(ti, (tok) => { tok.fx.clip = pick.dataset.clip ? Number(pick.dataset.clip) : undefined; });
            el.querySelectorAll('.clip').forEach(x => x.classList.toggle('on', x === pick));
            return;
          }
          const gl = e.target.closest('button[data-glitch]');
          if (gl) {
            const g = gl.dataset.glitch, on = !gl.classList.contains('on');
            editTok(tis, (tok) => { tok.fx[g] = on || undefined; });
            gl.classList.toggle('on', on);
            return;
          }
          const b = e.target.closest('button'); if (!b) return;
          if (b.dataset.sentence !== undefined) {
            sel = sentenceOf(ti); selAnchor = sel[0]; drawChips();
            drawFxPop($('chips').querySelector(`.chip[data-ti="${ti}"]`) || chip);
            return;
          }
          editTok(tis, (tok) => {
            if (b.dataset.clear !== undefined) { tok.fx = {}; tok.note = null; tok.base = tok.base.replace(/^~(.+)~$/, '$1'); }
            else if (b.dataset.emph !== undefined) tok.fx.emph = b.dataset.emph || undefined;
          });
          drawFxPop($('chips').querySelector(`.chip[data-ti="${ti}"]`) || chip);
        };
        if (!many) drawClips(el, ti);
      });
  }
  $('chips').addEventListener('click', (e) => {
    const c = e.target.closest('.chip[data-ti]'); if (!c) return;
    const ti = Number(c.dataset.ti);
    if (e.shiftKey && selAnchor !== null) sel = span(selAnchor, ti);
    else { sel = [ti]; selAnchor = ti; }
    drawChips();
    drawFxPop($('chips').querySelector(`.chip[data-ti="${ti}"]`) || c);
  });

  const SHOWN = 60;
  function drawChips() {
    const chips = preview(textInput.value);
    const el = $('chips');
    el.innerHTML = chips.slice(0, SHOWN).map(c =>
      `<span class="chip ${c.cls}${tuned() ? ' sung' : ''}${sel.includes(c.ti) ? ' sel' : ''}" data-ti="${c.ti}" title="${esc(c.title)} · click for pause, speed, pitch, volume, emphasis">${c.rev ? '<span class="mark">↺</span>' : ''}${esc(c.label)}${c.held ? '<span class="mark">⟷</span>' : ''}${tuned() && c.note ? `<span class="note">♪${esc(c.note)}</span>` : ''}${c.fx && c.fx.v ? `<span class="vo" title="said by ${esc(voiceName(c.fx.v))}">${esc(voiceName(c.fx.v).split(/[\s-]/)[0])}</span>` : ''}${c.fx ? `<span class="fx" title="${esc(Object.entries(c.fx).map(([k, v]) => v === true ? k : `${k} ${v}`).join(', '))}">✦</span>` : ''}</span>`).join('')
      + (chips.length > SHOWN ? `<span class="chip more">+${chips.length - SHOWN} more</span>` : '');
    // Roughly how long it will take: clips are quick, spliced words are not.
    const n = chips.length, splice = chips.filter(c => c.cls === 'splice').length;
    const secs = Math.round(n * 0.15 + splice * 1.6);
    const meter = $('input-meter');
    meter.innerHTML = n ? `<b>${n}</b> word${n === 1 ? '' : 's'}${splice ? ` · <b>${splice}</b> to splice` : ''} · ${secs < 5 ? 'a moment' : secs < 90 ? `~${secs}s` : `~${Math.round(secs / 60)} min`}` : '';
    meter.classList.toggle('warn', secs > 45);
    submitBtn.disabled = !textInput.value.trim() || busy;
  }

  // The box grows with what is in it.
  function fit() { textInput.style.height = 'auto'; textInput.style.height = `${textInput.scrollHeight}px`; }

  // The text as it reads, while you are not typing in it: the markup the
  // word menu writes -- {pitch=3,shake,v=james-channel}, ^+2, ~backwards~ --
  // folded into a marked word you can hover. Click it to edit the real text,
  // with the caret after the word you clicked.
  const MARKUP = /[{^~]/;
  function drawView() {
    const view = $('text-view');
    const fold = document.activeElement !== textInput && MARKUP.test(textInput.value);
    view.hidden = !fold; textInput.hidden = fold;
    if (!fold) { fit(); return; }
    let at = 0;
    view.innerHTML = textInput.value.split(/(\s+)/).map((part, j) => {
      at += part.length;
      if (j % 2 || !part) return esc(part);
      const t = splitTok(part), rev = /^~.+~$/.test(t.base);
      const fx = Object.entries(t.fx).filter(([, x]) => x !== undefined && x !== null);
      if (!fx.length && !t.note && !rev) return `<span data-end="${at}">${esc(part)}</span>`;
      const what = [...fx.map(([k, x]) => x === true ? k : k === 'v' ? `said by ${voiceName(x)}` : `${k} ${x}`),
                    ...(t.note ? [`note ${t.note}`] : []), ...(rev ? ['backwards'] : [])].join(', ');
      return `<span class="fxw${t.fx.v ? ' voiced' : ''}" data-end="${at}" title="${esc(what)}">${esc(t.base.replace(/^~(.+)~$/, '$1'))}`
        + `<sup>${rev ? '↺' : ''}${t.note ? '♪' : ''}${fx.length ? '✦' : ''}</sup></span>${esc(t.punct)}`;
    }).join('');
  }
  function unfold(pos = textInput.value.length) {
    $('text-view').hidden = true; textInput.hidden = false; fit();
    textInput.focus(); textInput.setSelectionRange(pos, pos);
  }
  $('text-view').addEventListener('click', (e) => {
    const w = e.target.closest('[data-end]');
    unfold(w ? Number(w.dataset.end) : undefined);
  });
  $('text-view').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); unfold(); } });
  // Folded only once the pointer is let go: folding on the press would move
  // whatever you were clicking out from under the pointer before the click.
  // A press can end without a release reaching the page (let go outside the
  // window), so a cancel or the window losing focus counts as one too, and a
  // second at most is waited for either way.
  let pressing = false, foldLater = false;
  const released = () => {
    pressing = false;
    if (foldLater) { foldLater = false; setTimeout(drawView); }
  };
  addEventListener('pointerdown', () => { pressing = true; }, true);
  for (const ev of ['pointerup', 'pointercancel']) addEventListener(ev, released, true);
  addEventListener('blur', (e) => { if (e.target === window) released(); });   // not every element's blur
  textInput.addEventListener('blur', () => {
    if (!pressing) return drawView();
    foldLater = true;
    setTimeout(released, 1000);
  });

  let chipTimer = null;
  textInput.addEventListener('input', () => {
    if (document.activeElement === textInput) fit(); else drawView();
    clearTimeout(chipTimer); chipTimer = setTimeout(drawChips, 60);
    queueSuggest();
    store.set('ytp-draft', textInput.value);
  });
  textInput.value = store.get('ytp-draft', '');
  drawView();

  document.querySelector('.helpers').addEventListener('click', (e) => {
    if (e.target.closest('[data-more-noises]')) return drawNoises(true);
    const b = e.target.closest('button[data-insert]'); if (!b) return;
    insertAtCaret(b.dataset.insert);
  });
  function insertAtCaret(token) {
    const at = textInput.selectionStart ?? textInput.value.length;
    const before = textInput.value.slice(0, at), after = textInput.value.slice(at);
    const lead = before && !/\s$/.test(before) ? ' ' : '';
    const tail = /^\s/.test(after) ? '' : ' ';
    textInput.value = before + lead + token + tail + after;
    const caret = (before + lead + token).length;
    textInput.focus();
    textInput.setSelectionRange(caret, caret);
    textInput.dispatchEvent(new Event('input'));
  }

  // ── Suggestions: the voice's words, and what it said next ────────────────
  const suggestBox = $('suggest-box');
  let items = [], active = -1, fetchSeq = 0, suggestTimer = null;
  function caretParts() {
    const pos = textInput.selectionStart, before = textInput.value.slice(0, pos);
    const partial = (before.match(/[^\s]*$/) || [''])[0];
    return { context: before.slice(0, before.length - partial.length), partial, start: pos - partial.length, pos };
  }
  function closeSuggest() { suggestBox.classList.remove('open'); items = []; active = -1; }
  function drawSuggest() {
    if (!items.length) return closeSuggest();
    suggestBox.innerHTML = items.map((it, i) =>
      `<div class="suggest-item ${it.kind}${i === active ? ' active' : ''}" data-i="${i}" role="option"><span>${esc(it.word)}</span><span class="s-meta">${esc(it.meta)}</span></div>`).join('');
    suggestBox.classList.add('open');
  }
  suggestBox.addEventListener('mousedown', (e) => {
    const row = e.target.closest('.suggest-item'); if (!row) return;
    e.preventDefault(); accept(Number(row.dataset.i));
  });
  function accept(i) {
    const it = items[i]; if (!it) return;
    const { start, pos } = caretParts(), val = textInput.value;
    textInput.value = val.slice(0, start) + it.word + ' ' + val.slice(pos);
    const at = start + it.word.length + 1;
    textInput.setSelectionRange(at, at);
    closeSuggest();
    textInput.dispatchEvent(new Event('input'));
  }
  function queueSuggest() { clearTimeout(suggestTimer); suggestTimer = setTimeout(fetchSuggest, 140); }
  async function fetchSuggest() {
    if (document.activeElement !== textInput) return;
    const { context, partial } = caretParts();
    const prefix = partial.replace(/[^\w]/g, '').toLowerCase();
    if (!prefix && !context.trim()) return closeSuggest();
    const seq = ++fetchSeq;
    const r = await fetchJson('/api/suggest?' + new URLSearchParams({ context: context.trim(), prefix, limit: 8 }));
    if (!r.ok || seq !== fetchSeq) return;
    items = [
      ...(r.data.continuations || []).map(c => ({ word: c.word, kind: 'phrase', meta: `said next ×${c.sources}` })),
      ...(r.data.words || []).map(w => ({ word: w.word, kind: 'vocab', meta: `${w.clips} clip${w.clips > 1 ? 's' : ''}` })),
    ].slice(0, 8);
    active = -1;
    drawSuggest();
  }
  textInput.addEventListener('blur', () => setTimeout(closeSuggest, 150));
  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); return submit(); }
    if (!items.length || !suggestBox.classList.contains('open')) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); active = (active + 1) % items.length; drawSuggest(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = (active - 1 + items.length) % items.length; drawSuggest(); }
    else if (e.key === 'Tab') { e.preventDefault(); accept(active >= 0 ? active : 0); }
    else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); accept(active); }
    else if (e.key === 'Escape') closeSuggest();
  });

  // ── Generating ────────────────────────────────────────────────────────────
  let busy = false, lastText = '';
  const STAGE = { waiting: 'waiting to start', loading: 'loading the voice', resolving: 'finding the words',
                  encoding: 'making the video', joining: 'joining it together', singing: 'singing it', finished: 'finishing' };

  function setStatus(msg, error = false) { statusEl.textContent = msg; statusEl.className = error ? 'error' : ''; }
  function progress(fraction) {
    const el = $('progress');
    if (fraction === undefined) { el.hidden = true; return; }
    el.hidden = false;
    el.classList.toggle('indeterminate', fraction === null);
    $('progress-bar').style.width = fraction === null ? '' : `${Math.round(Math.min(1, Math.max(0, fraction)) * 100)}%`;
  }

  $('form').addEventListener('submit', (e) => { e.preventDefault(); submit(); });
  $('again-btn').addEventListener('click', () => submit(lastText));
  $('same-btn').addEventListener('click', () => current && submit(current.text, current.seed));

  // seed: the one the video it repeats was made with; left out, a new one.
  async function submit(text = textInput.value.trim(), seed = '') {
    if (!text || busy) return;
    busy = true; lastText = text;
    submitBtn.disabled = true; $('again-btn').disabled = true;
    closeSuggest();
    setStatus('sending…'); progress(null);
    try {
      const res = await postJson('/api/generate', { text, subtitles: $('subtitles').checked, options: { ...opts, seed } });
      if (res.error) return setStatus(`Error: ${res.error}`, true);
      if (!res.ok) {
        const d = res.data.detail;
        return setStatus(`Error: ${typeof d === 'object' ? d.message : (d || `server said ${res.status}`)}`, true);
      }
      const result = await poll(res.data.id, res.data.position ?? 0);
      if (!result) return;
      if (!result.video_url) return setStatus('Nothing in that could be said with this voice.', true);
      const entry = { text, url: result.video_url, tokens: result.tokens || [], timeline: result.timeline || [],
                      seed: (result.options || {}).seed || '', at: Date.now() };
      show(entry, true);
      remember(entry);
      loadStats();
    } finally {
      busy = false; progress(undefined);
      $('again-btn').disabled = false;
      drawChips();
    }
  }

  async function poll(id, position) {
    let delay = 250;
    if (position > 0) setStatus(`queued — ${position} ahead of you`);
    for (;;) {
      await new Promise(r => setTimeout(r, delay));
      delay = Math.min(delay * 1.4, 1500);
      const res = await fetchJson(`/api/jobs/${id}`);
      if (res.error) { setStatus(`Error: ${res.error}`, true); return null; }
      if (!res.ok) { const d = res.data.detail; setStatus(`Error: ${(typeof d === 'object' ? d.message : d) || 'job lost'}`, true); return null; }
      const j = res.data;
      if (j.status === 'error') { setStatus(`Error: ${j.error}`, true); return null; }
      if (j.status === 'done') { setStatus(''); return j.result; }
      if (j.status === 'queued') {
        const ahead = j.position ?? 0;
        setStatus(ahead ? `queued — ${ahead} ahead of you` : 'queued behind another job');
        progress(null);
      } else {
        const secs = j.running_for ? ` · ${Math.round(j.running_for)}s` : '';
        if (j.stage === 'resolving' && j.total > 0) {
          setStatus(`${STAGE.resolving}: ${j.done} of ${j.total}${secs}`);
          progress(0.05 + 0.7 * (j.done / j.total));
        } else if (j.stage === 'encoding' || j.stage === 'joining') {
          setStatus(`${STAGE[j.stage]}${j.total > 1 ? ` (part ${Math.min(j.done + 1, j.total)} of ${j.total})` : ''}${secs}`);
          progress(0.75 + 0.25 * (j.total > 1 ? j.done / j.total : 0.5));
        } else {
          setStatus(`${STAGE[j.stage] || j.stage}${secs}`);
          progress(0.03);
        }
      }
    }
  }

  // ── The result ────────────────────────────────────────────────────────────
  const video = $('output-video');
  let current = null, marks = [];

  function show(entry, play) {
    current = entry;
    $('result').hidden = false;
    video.src = entry.url;
    const a = $('download-link');
    a.href = entry.url;
    a.download = downloadName(entry.text, entry.url);
    drawWords(entry);
    const t = entry.tokens, count = (s) => t.filter(x => x.status === s).length;
    const parts = [];
    if (count('run')) parts.push(`${count('run')} in real phrases`);
    if (count('found')) parts.push(`${count('found')} clips`);
    if (count('spliced')) parts.push(`${count('spliced')} spliced`);
    if (count('missing')) parts.push(`${count('missing')} missing`);
    $('summary').textContent = parts.join(' · ');
    $('same-btn').hidden = !entry.seed;
    drawHistory();
    if (play) {
      video.play().catch(() => {});
      $('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  const TITLES = { run: 'part of a phrase the voice really said', found: 'a recording of this word',
                   spliced: 'built from pieces of other words', missing: 'not something this voice can say' };
  function drawWords(entry) {
    const when = Object.fromEntries((entry.timeline || []).map(w => [w.i, w]));
    const el = $('word-results');
    el.innerHTML = '';
    marks = [];
    entry.tokens.forEach((t, i) => {
      const cls = ['run', 'found', 'spliced', 'missing'].includes(t.status) ? t.status : 'missing';
      const w = document.createElement('span');
      w.className = `word ${cls}${t.approx ? ' approx' : ''}`;
      w.title = t.approx ? 'approximated — a sound was swapped, dropped, or guessed' : TITLES[cls];
      w.tabIndex = cls === 'missing' ? -1 : 0;
      const label = document.createElement('span');
      label.textContent = t.stretched || t.shown || t.word;
      w.appendChild(label);
      if (t.voice) w.title += ` · said by ${voiceName(t.voice)}`;
      if (cls !== 'missing' && !t.voice) {
        const acts = document.createElement('span');
        acts.className = 'acts';
        const first = Array.isArray(t.clips) ? t.clips[0] : null;
        const href = (cls === 'spliced' || t.approx) ? `/splice.html?word=${encodeURIComponent(t.word)}`
                   : first ? `/editor.html?clip=${first}&word=${encodeURIComponent(t.word)}` : null;
        if (href) {
          const open = document.createElement('a');
          open.href = href; open.target = '_blank'; open.rel = 'noopener'; open.textContent = '↗';
          open.title = cls === 'spliced' ? 'see how this word is built' : 'open this clip in the corpus editor';
          open.addEventListener('click', (e) => e.stopPropagation());
          acts.appendChild(open);
        }
        if (Array.isArray(t.clips) && t.clips.length) {
          acts.appendChild(voteButton(t, w, +1, '▲', 'use these clips more for this word'));
          acts.appendChild(voteButton(t, w, -1, '▼', 'use these clips less for this word'));
          acts.appendChild(reportButton(t));
        }
        w.appendChild(acts);
      }
      const span = when[i];
      if (span) {
        marks.push({ el: w, start: span.start, end: span.end });
        const seek = () => { video.currentTime = span.start + 0.001; video.play().catch(() => {}); };
        w.addEventListener('click', seek);
        w.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); seek(); } });
      }
      el.appendChild(w);
    });
  }

  // The word being said, lit as the video plays.
  function lightWord() {
    const t = video.currentTime;
    for (const m of marks) m.el.classList.toggle('now', !video.paused && t >= m.start && t < m.end + 0.04);
  }
  video.addEventListener('timeupdate', lightWord);
  video.addEventListener('pause', lightWord);
  video.addEventListener('seeked', lightWord);
  // timeupdate fires a few times a second; a frame loop keeps the highlight on the beat.
  (function tick() { if (!video.paused) lightWord(); requestAnimationFrame(tick); })();

  // Where a word is cut wrong, said with one click: the generator avoids the
  // clip from then on, and the corpus editor lists it until somebody fixes it.
  const BOUNDARY = [['starts late', 'the start of the word is cut off'],
                    ['starts early', 'it begins with a bit of the word before'],
                    ['ends early', 'the end of the word is cut off'],
                    ['ends late', 'it runs on into the next word']];
  function reportButton(token) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = '✂'; b.title = 'this word is cut in the wrong place';
    b.setAttribute('aria-label', `Report where ${token.word} is cut`);
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      openPop(b, `<div class="ph"><b>${esc(token.word)}</b> is cut wrong:</div><div class="kinds">${BOUNDARY.map(([k, why]) =>
        `<button type="button" data-kind="${k}" title="${esc(why)}">${esc(k)} <span class="hint">— ${esc(why)}</span></button>`).join('')}</div>`,
        (el) => { el.onclick = async (ev) => {
          const k = ev.target.closest('button[data-kind]'); if (!k) return;
          const r = await postJson('/api/boundary', { clips: token.clips, kind: k.dataset.kind });
          el.innerHTML = r.ok ? `<div class="ph">Thanks — <b>${esc(token.word)}</b> reported as ${esc(k.dataset.kind)}. That clip will be used less, and it is flagged in the corpus editor.</div>`
                              : `<div class="ph err">${esc(r.error || 'could not report it')}</div>`;
          b.classList.add('on');
          setTimeout(() => { pop.hidden = true; }, 1800);
        }; });
    });
    return b;
  }

  function voteButton(token, tag, dir, glyph, title) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = glyph; b.title = title;
    b.setAttribute('aria-label', `${dir > 0 ? 'Upvote' : 'Downvote'} ${token.word}`);
    b.addEventListener('click', async (e) => {
      e.stopPropagation();
      const now = Number(tag.dataset.vote || 0), rating = now === dir ? 0 : dir;
      const r = await postJson('/api/rate', { word: token.word, clips: token.clips, rating });
      if (!r.ok) return;
      tag.dataset.vote = String(rating);
      tag.classList.toggle('voted-down', rating < 0);
      tag.querySelectorAll('.acts button').forEach(x => x.classList.toggle('on', rating !== 0 && x === b));
    });
    return b;
  }

  function downloadName(said, url) {
    const stem = (said || '').replace(/[~*]/g, '').replace(/[^\w\-. ]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60) || 'ytp';
    const id = (url.match(/([0-9a-f]{6,})\.mp4$/) || [])[1] || '';
    return `${stem}${id ? ' ' + id : ''}.mp4`;
  }

  // ── Recent ────────────────────────────────────────────────────────────────
  // The last few videos made in this browser, to go back to. Old ones may
  // have been cleared off the server, in which case they are dropped.
  const KEEP = 8;
  function remember(entry) {
    const list = store.get('ytp-history', []).filter(h => h.url !== entry.url);
    list.unshift(entry);
    store.set('ytp-history', list.slice(0, KEEP));
    drawHistory();
  }
  function ago(ms) {
    const s = Math.round((Date.now() - ms) / 1000);
    return s < 60 ? 'just now' : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`;
  }
  function drawHistory() {
    const list = store.get('ytp-history', []);
    $('history').hidden = !list.length;
    $('history-list').innerHTML = list.map((h, i) =>
      `<button type="button" class="past${current && current.url === h.url ? ' current' : ''}" data-i="${i}">
         <span class="play">▶</span><span class="said">${esc(h.text)}</span><span class="when">${ago(h.at)}</span>
       </button>`).join('');
  }
  $('history-list').addEventListener('click', (e) => {
    const b = e.target.closest('.past'); if (!b) return;
    const h = store.get('ytp-history', [])[Number(b.dataset.i)];
    if (!h) return;
    lastText = h.text;
    show(h, true);
  });
  // An error is not the same as the video being gone. A connection dropped
  // mid-play -- the server restarting, a network blip -- raised it too, and
  // used to hide the video and strike it from the history while the file sat
  // there fine. Ask the server first: only a 404 means it was cleared away.
  let retries = 0, retryFor = null;
  video.addEventListener('error', async () => {
    if (!current) return;
    const entry = current, at = video.currentTime, wasPlaying = !video.paused || at > 0;
    const head = await fetch(entry.url, { method: 'HEAD', cache: 'no-store' }).catch(() => null);
    if (current !== entry) return;                       // moved on meanwhile
    if (head && head.status === 404) {
      store.set('ytp-history', store.get('ytp-history', []).filter(h => h.url !== entry.url));
      setStatus('That video is no longer on the server.', true);
      $('result').hidden = true; current = null;
      drawHistory();
      return;
    }
    if (retryFor !== entry.url) { retryFor = entry.url; retries = 0; }
    if (++retries > 3) return setStatus('The video keeps dropping out. Try again in a moment.', true);
    setTimeout(() => {
      if (current !== entry) return;
      video.src = `${entry.url}?r=${Date.now()}`;       // a fresh request, not the dead one
      video.addEventListener('loadedmetadata', () => {
        video.currentTime = at;
        if (wasPlaying) video.play().catch(() => {});
      }, { once: true });
    }, 1000 * retries);
  });

  // ── Start ─────────────────────────────────────────────────────────────────
  loadStats(); loadCorpora(); loadSpliceMode(); loadMaxUnits(); loadNoises(); loadWords();
  drawChips(); drawHistory();
  textInput.focus();
})();
</script>
</body>
</html>
