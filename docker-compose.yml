# `docker compose up --build`, then open http://localhost:8765
#
# Nothing to set up first: the corpus is committed, so a clone has everything.
# The database and videos are mounted read-only and copied into the volume the
# first time the container finds no database.
services:
  app:
    # Named, so `docker compose pull` can fetch the published build instead of
    # spending several minutes and 3 GB making an identical one locally. With
    # only `build:` here, every clone had to compile its own copy of an image
    # that already exists on GHCR.
    image: ghcr.io/kapsikkum/ytp-machine:latest
    build: .
    environment:
      # Affects nothing in the app itself, but keeps container logs readable
      # next to the host's.
      TZ: ${TZ:-Australia/Sydney}
    ports:
      - "8765:8765"
    volumes:
      - ytp-data:/app/data
      # Seeds an empty volume and is ignored once a corpus exists, so it is
      # safe to leave mounted. One corpus directory, mounted whole -- a packed
      # bundle dropped in here works the same way.
      - ./corpora/michael-rosen:/corpus:ro
      # Drop more bundles in packs/ to add voices. Each is installed as a
      # corpus named after the file, once, and selectable in the UI.
      - ./packs:/packs:ro
    restart: unless-stopped

  # The Matrix bot. Off unless asked for, so a plain `docker compose up` is
  # unchanged:
  #
  #   docker compose --profile matrix up
  #
  # Same image, its own process: it talks to the app over HTTP, so a bot that
  # falls over cannot take the web page with it. Put the settings in a .env
  # file beside this one (see the README), never in this file.
  bot:
    image: ghcr.io/kapsikkum/ytp-machine:latest
    build: .
    profiles: [matrix]
    entrypoint: ["python", "-m", "app.matrix_bot"]
    environment:
      TZ: ${TZ:-Australia/Sydney}
      YTP_API_URL: http://app:8765
      YTP_PUBLIC_URL: ${YTP_PUBLIC_URL:-}
      # Plain defaults, not ${VAR:?}: compose interpolates every service even
      # when its profile is off, so a required variable here would break the
      # ordinary `docker compose up` for everyone without a bot. The bot says
      # what is missing itself when it starts.
      MATRIX_HOMESERVER: ${MATRIX_HOMESERVER:-}
      MATRIX_USER: ${MATRIX_USER:-}
      MATRIX_PASSWORD: ${MATRIX_PASSWORD:-}
      MATRIX_ACCESS_TOKEN: ${MATRIX_ACCESS_TOKEN:-}
      MATRIX_ALLOWED_ROOMS: ${MATRIX_ALLOWED_ROOMS:-}
      MATRIX_ALLOWED_USERS: ${MATRIX_ALLOWED_USERS:-}
      MATRIX_ADMINS: ${MATRIX_ADMINS:-}
      MATRIX_PREFIX: ${MATRIX_PREFIX:-!ytp}
      MATRIX_COOLDOWN: ${MATRIX_COOLDOWN:-20}
      MATRIX_MV_MAX_SECONDS: ${MATRIX_MV_MAX_SECONDS:-120}
    volumes:
      # For the saved login (matrix/session.json), so a restart is not a new
      # device every time.
      - ytp-data:/app/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ytp-data:
