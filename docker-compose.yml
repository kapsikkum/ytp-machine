# `docker compose up --build`, then open http://localhost:8765
#
# Nothing to set up first: the corpus is committed, so a clone has everything.
# The database and videos are mounted read-only and copied into the volume the
# first time the container finds no database.
services:
  app:
    build: .
    environment:
      # Affects nothing in the app itself, but keeps container logs readable
      # next to the host's.
      TZ: ${TZ:-Australia/Sydney}
    ports:
      - "8765:8765"
    volumes:
      - ytp-data:/app/data
      # Seeds an empty volume and is ignored once the database exists, so it is
      # safe to leave mounted. A packed bundle in corpus/ works here too.
      - ./michael_rosen.db:/corpus/michael_rosen.db:ro
      - ./downloads:/corpus/downloads:ro
      - ./transcripts:/corpus/transcripts:ro
    restart: unless-stopped

volumes:
  ytp-data:
