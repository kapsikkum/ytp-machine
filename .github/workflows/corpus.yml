name: corpus

# Publish the shipped corpus as a downloadable bundle.
#
# The corpus is committed as loose files because GitHub rejects any single file
# over 100 MB and the packed bundle is 103 MB. A release asset has no such
# limit, which makes it the one place a bundle can live at a stable public URL
# -- and a URL is what the container wants: CORPUS_URL is the only way to run
# the published image without a clone to mount a corpus from.
#
# Deliberately not an Actions artifact: those expire, and downloading one needs
# an authenticated API call, so it cannot be handed to CORPUS_URL.
#
# Manual, because packing 110 MB on every push would be waste. Run it from the
# Actions tab, or push a tag like corpus-2026-08-28.

on:
  workflow_dispatch:
    inputs:
      corpus:
        description: Which corpus to pack
        default: michael-rosen
      tag:
        description: Release tag to attach it to
        default: corpus
  push:
    tags: ["corpus-*"]

permissions:
  contents: write

env:
  CORPUS: ${{ github.event.inputs.corpus || 'michael-rosen' }}
  TAG: ${{ github.event.inputs.tag || 'corpus' }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pack the corpus, both ways
        # .tar.zst is the smaller one and what pack writes by default; .tar.gz
        # needs nothing installed to open, which matters for anyone who just
        # wants to look inside a bundle without setting up the project first.
        # unpack reads either, and the container accepts either at /corpus,
        # /packs or CORPUS_URL.
        run: |
          pip install zstandard
          python scripts/corpus.py pack --corpus "$CORPUS" --out "$CORPUS.tar.zst"
          python scripts/corpus.py pack --corpus "$CORPUS" --out "$CORPUS.tar.gz"
          python scripts/corpus.py info "$CORPUS.tar.zst"
          python scripts/corpus.py info "$CORPUS.tar.gz"

      - name: Check they unpack
        # The packer once produced truncated bundles that passed their own
        # checksum, because the checksum was taken over the same truncated
        # bytes. Reading it back is the only check that means anything, and
        # both formats get it -- the bug was in the zstd path, and only the
        # gzip one had ever actually shipped.
        run: |
          for ext in tar.zst tar.gz; do
            rm -rf /tmp/verify
            mkdir -p /tmp/verify
            MRS_DATA_DIR=/tmp/verify python scripts/corpus.py unpack "$CORPUS.$ext"
            # A bundle holds corpus.db, downloads/ and transcripts/ at its top
            # level -- the corpus name is not inside it -- so unpack without
            # --into lays them out at the data-dir root, not under corpora/.
            test -f /tmp/verify/corpus.db
            test -d /tmp/verify/downloads
            echo "$ext: $(du -sh /tmp/verify | cut -f1), $(ls /tmp/verify/downloads | wc -l) videos"
          done

      - name: Attach them to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Corpus bundles" \
            --notes "Packed corpora, for CORPUS_URL. See the README."
          gh release upload "$TAG" "$CORPUS.tar.zst" "$CORPUS.tar.gz" --clobber
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          echo "CORPUS_URL=$BASE/$CORPUS.tar.zst"
          echo "CORPUS_URL=$BASE/$CORPUS.tar.gz   (needs no zstandard)"
