name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile every module
        # Cheap, and it catches the syntax and indentation mistakes that
        # otherwise only surface when a route is first hit in production.
        run: python -m compileall -q app scripts main.py
      - name: Corpus tool is runnable
        run: python scripts/corpus.py --help

      - name: Tokeniser
        # The tokeniser decides which words get looked up, so a mistake in it
        # is either a word reported missing that the corpus has, or a different
        # word said confidently -- and only the first of those is visible.
        run: |
          pip install num2words nltk
          python tests/test_tokenize.py

      - name: Bundle round-trip
        # A corpus bundle that packs, checksums and lists cleanly can still be
        # truncated -- every .tar.zst ever written was, and it surfaced days
        # later on a server. zstandard is installed explicitly because without
        # it the packer falls back to gzip and the test passes having never
        # touched the path that broke.
        run: |
          pip install zstandard
          python tests/test_bundle.py

      - name: Corpus selection
        # This decides where downloads and clip rows are written, so a mistake
        # does not fail -- it succeeds against the wrong corpus.
        run: python tests/test_corpus_select.py

      - name: Extraction window
        # What span of audio each clip is pulled from. It decides what every
        # clip sounds like and used to be checkable only by rendering a video
        # and listening -- which is how a tail that ran into the next word
        # survived until somebody heard "mother like".
        run: python tests/test_extract_window.py

      - name: Phoneme cuts
        # Turning stored phoneme times into a sub-word cut. The times come
        # from a model at build time; this is the arithmetic that uses them,
        # and it runs on a bare interpreter.
        run: python tests/test_phone_cuts.py

      - name: Splice editor
        # The editor writes recipes the generator then obeys, so a recipe that
        # is accepted but cannot be realised is a fault nobody sees until a
        # sentence comes out wrong days later.
        #
        # The only step here that installs anything. The test skips its API
        # half without FastAPI and would have gone quietly half-blind, which
        # is worse than the ten seconds this costs.
        run: |
          pip install --quiet fastapi pydantic
          python tests/test_splice_editor.py

      - name: Splice modes
        # Guessed pronunciations and phoneme substitutions only run outside
        # strict mode, so a mistake here is invisible until someone turns the
        # mode up -- and then every word comes out wrong at once.
        run: python tests/test_splice_modes.py

      - name: Pitch perfect
        # The YTPMV's whole claim is that a word lands on the note, not near
        # it. This sings a wobbling synthetic vowel on several notes and
        # measures every voiced frame of the result.
        run: |
          pip install --quiet numpy mido
          python tests/test_pitch.py

      - name: Reading MIDI
        # Tempo maps, key, which part is the bass and which the tune -- every
        # choice the YTPMV makes afterwards starts from this.
        run: python tests/test_music.py

      - name: The sound chips
        # Both of them. Envelope rates, multipliers, algorithms, shift
        # register periods, duty widths and the output stages, against
        # figures from the datasheets rather than from these
        # implementations -- a wrong chip still makes a noise, and the
        # noise is all anybody looks at.
        run: python tests/test_ym2612.py

      - name: Loudness and balance
        # A loudness meter is easy to write wrongly and a wrong one still
        # hands back a number that looks like decibels, so these are checked
        # against signals whose loudness follows from arithmetic.
        run: python tests/test_master.py

      - name: The picture, put through a console
        # That every colour out is one the machine could have made, and that
        # the tables are the hardware's rather than a plausible-looking ramp.
        run: python tests/test_screen.py

      - name: The Master System and SNES chips
        # Dividers, attenuation steps and shift-register periods against
        # SMSPower's notes; BRR predictors and the interpolation table
        # against fullsnes. The table's taps must sum to unity gain.
        run: python tests/test_sms_snes.py

      - name: The Game Boy chip
        # Channel ranges against the Pan Docs, the capacitor against
        # SameBoy, and that a held square sags and a note starts clean.
        run: python tests/test_gb.py

      - name: The OPL and SID chips
        # The OPL against Nuked-OPL3's ROMs and published envelope timings,
        # GENMIDI's layout, the SID against reSID -- and every chip's drums
        # driven through the same path render takes, which is where they
        # were once silently replaced by the voice.
        run: python tests/test_opl_sid.py

      - name: No voice
        # A song played by the chip alone: every part synthesised, none muted
        # for want of a word, the SNES refused, and each tile an oscilloscope
        # that triggers steadily and lands on a red in every console's palette.
        # Ends with a real render through ffmpeg.
        run: python tests/test_synth_mode.py

      - name: Matrix commands
        # What the bot hears in a message. Plain string handling, and where
        # the mistakes would be; needs no homeserver.
        run: python tests/test_matrix_commands.py

  image:
    # Only publish from the default branch: a pull request should prove the
    # image builds without also pushing a tag anyone could pull by accident.
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
